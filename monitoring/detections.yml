# What each detection the NOC runs can't see (OROS NOT-6, decision 0027).
#
# A detection is an alert rule in build/noc/rules.yml, rendered from the inventory by netlab/monitoring.py.
# `make detections` (netlab/detections.py) writes docs/detections.md from the rules themselves (what each
# reads, where its sensor sits, which objects it watches), from monitoring/coverage.yml (each collector's
# exporter and what it reads), from this file (what it detects, its blind spots) and from
# monitoring/fp-review.yml (its pages over the stated benign workload). tests/test_detections.py fails when
# a deployed rule has no entry here, an entry has a blank cell, docs/detections.md is not what the rules
# give now, or the false-positive review is older than one cycle or was run on other rules.
#
# Blind spots are what the detection misses in this lab as built: traffic that never reaches its sensor,
# objects it doesn't watch, failures shorter than its wait, and what it trusts without checking.
#
# A detection whose rules read no metric and name no object (Watchdog) says in its own reads, sensor and
# watches what stands for them.
#
# A detection that looks back further than the review (its wait, a range it reads, or an age it compares
# with the clock) could not have paged on the review's workload, so its 0 measures nothing. Its
# beyond_review says what stands for its figure, and make test fails if one has none.

review:
  # OROS NOT-6's default review cycle is quarterly. make test fails once the last review is older.
  cycle_days: 92
  # The benign workload runs this long (netlab/detections.py WORKLOAD says what it does).
  minutes: 30

detections:
  TargetDown:
    detects: an exporter or probe endpoint the NOC scrapes that has not answered for 15 s (three scrapes)
    blind_spots:
      - "A target that answers with wrong or stale values passes: frr_exporter still answers while a routing daemon is down (frr_collector_up says so, and no rule reads it)."
      - "Only what Prometheus scrapes: fw1, h1 and isp run no exporter, and h2 runs only node_exporter. The ICMP probes are targets of blackbox on noc, which answers even when the ping fails, and no rule reads probe_success for ICMP, so a device that stops answering ping does not page by itself."
      - "A target down for less than its 15 s wait plus a scrape does not page."
      - "In band: a dead campus link makes every target behind it fail at once (RISK-31). They wait behind the link's or router's own page (decision 0021), and a dead uplink from noc pages as r2 (RISK-43)."
  BGPSessionDown:
    detects: a BGP session on a router we own that is not Established (down, or shut on either end), or gone from the exporter
    blind_spots:
      - "Only sessions on routers we own (r2 to isp); the carrier's own view of the session is not read."
      - "An Established session that carries no prefixes, or the wrong ones, does not page: the prefix counts are exported, and no rule reads them."
      - "A session that drops and comes back inside its 10 s wait plus a scrape does not page; the reset shows only in frr_bgp_peer_uptime_seconds and an ADJCHANGE line in the store."
      - "Whether TCP MD5 is on is not exported (monitoring/coverage.yml lists it as a gap); make drift checks the password tag instead."
      - "A session configured by hand that the inventory doesn't have is not watched; absent() catches a session that disappears, not an extra one."
  OSPFNeighborDown:
    detects: an OSPF adjacency the inventory implies that is not Full, or gone from the exporter
    blind_spots:
      - "Only adjacencies the inventory implies: an extra adjacency with a router nobody planned does not page (tests/live/test_routing.py catches it when CI runs)."
      - "It pages only once OSPF itself drops the adjacency, up to its 40 s dead interval after hellos stop, then its 10 s wait."
      - "A Full adjacency over a link that has stopped forwarding traffic stays green; that is BFDPeerDown's case."
      - "An adjacency lost and re-formed inside the wait does not page; ospfd's AdjChg lines are in the store."
  BFDPeerDown:
    detects: a BFD peer on an OSPF link of a router we own that is not up, or gone from the exporter
    blind_spots:
      - "BFD runs only on the routers' OSPF links: the links to fw1, h2, noc and isp have none."
      - "BFD tests the path between the two routers; transit traffic that one of them drops (a filter, a full queue) while BFD's own packets pass is not seen."
      - "Down for less than its 10 s wait plus a scrape does not page, though BFD itself reacts in under a second."
  WebContentWrong:
    detects: h2's page at port 80 that does not answer 200 with the content only the real page has
    blind_spots:
      - "One vantage point: the NOC's LAN, through r2 and r3. A user's path from LAN-A through fw1 and r1 is not probed."
      - "One page and one port: only GET / on port 80, matched on href=\"etc/\"; h2's port 22 and every other page are unchecked."
      - "A page slower than a user would accept still passes if it answers inside the probe's 3 s timeout."
      - "The NOC's checks are cut at h2's forwarder whenever h2 answers 200 (decision 0026), a check that fails on content included, so the store holds only their count; a check shows in the access log only when h2 answers it with another status (RISK-55)."
  InterfaceFlapped:
    detects: a router interface whose carrier changed in the last minute, however briefly
    blind_spots:
      - "Routers we own only: interfaces on fw1, h1, h2, noc and isp are not watched."
      - "Carrier changes only: a link that stays up and silently drops everything is not a flap (BFDPeerDown's case)."
      - "Every flap inside one minute is one alert, so a link flapping all the time pages once and stays firing."
  PendingRebootOverdue:
    detects: a router that has run an older kernel than the newest one installed for longer than its reboot window
    blind_spots:
      - "The kernel only: an FRR or library update not yet restarted is found by make verify on demand, not alerted."
      - "Inside the window (3600 s) nothing pages, by design."
      - "Every lab node shares the host's kernel, so in the lab a pending kernel is staged (a newer module folder), never really installed."
    beyond_review: "a false page needs a pending reboot older than its window, and the workload stages no kernel, so nothing in it could page (RISK-58)"
  SourceSilent:
    detects: a log source whose last line reached the collector longer ago than its silent_after, or that never sent one
    blind_spots:
      - "A source that keeps its heartbeat while its daemons stop logging stays green; only a daemon's own line in the store proves that daemon logs."
      - "Single lost or forged lines: syslog is clear UDP with no acknowledgement (RISK-34), so one missing line is never seen."
      - "h1 sends nothing (RISK-36) and isp's log stays on its own box, so neither can go silent."
      - "h2's web log proves it is alive with the forwarder's count of the NOC's own checks: if the checks stop, it goes silent while the app may be fine."
      - "Silent for less than silent_after (90 s) does not page."
  LogIngestOverBudget:
    detects: a log source whose last 24 h at the collector passed its daily budget from the inventory
    blind_spots:
      - "It counts the bytes of each line the collector hands to Loki, not what Loki keeps on disk with its index and compression, and it stops nothing (RISK-56)."
      - "A day's total, not a pace: a flood that stays under the day's budget does not page, however fast it came."
      - "Once a source's day is over its budget the alert stays firing until that day is out, so a second flood from it is no new page (RISK-57)."
      - "Lines cut at the source are not counted, by design, and lines lost on the way never arrive to be counted."
      - "Lines from an address the collector can't map are labelled node=unknown, and no rule has a budget for them."
    beyond_review: "its figure is each source's pace over the review as a day, in the ingest table below, and make test fails if one is over its budget (RISK-58)"
  NodeDown:
    detects: a device the NOC pings (r1, r2, r3, fw1, h2) that has not answered blackbox's ping from noc for 10 s; it is that device's cause, and holds back what depends on it (decision 0021)
    blind_spots:
      - "Ping only: a device that still answers ping while its routing daemons or services are down is up as far as NodeDown goes; their own alerts page for that."
      - "Only the devices the NOC pings: h1, isp and noc itself are no cause, so a dead isp pages as its BGP session and its link, and a dead h1 pages nothing."
      - "In band: the NOC pings from behind r2, so a dead uplink from noc pages as r2, and the NOC's own services are outside the model (RISK-43)."
      - "Down for less than its 10 s wait plus a probe does not page. One lost ping fires its marker, which holds back what depends on it for 75 s, and a real failure behind it waits that long (RISK-42)."
  LinkDown:
    detects: a link the NOC sees whose carrier is down at either end it reads for 10 s; it is that link's cause, and holds back what depends on it (decision 0021)
    blind_spots:
      - "Carrier only: a link that keeps its carrier while it drops traffic is not down (BFDPeerDown's case, and only on the routers' OSPF links)."
      - "Read where node_exporter runs: the links to fw1 and isp are read at the router's end only, h1's link to fw1 is not watched, and the NOC's own uplink is no cause (RISK-43)."
      - "Down for less than its 10 s wait plus a scrape is no LinkDown; the router's InterfaceFlapped pages for it once the carrier is back (decision 0021)."
  QueueDrops:
    detects: a queue on a node with a node_exporter (r1, r2, r3, h2) that dropped a packet in the last minute, however short the burst
    blind_spots:
      - "Root queues only: node_exporter exports each interface's root qdisc, so the page names the port, and the class is read on the node itself (tc -s class show)."
      - "The routers' veth ports run noqueue, so they have no queue to drop in; a drop there shows in node_network_transmit_drop_total, which no rule reads."
      - "fw1, h1, noc and isp run no node_exporter, so their queues are not watched."
      - "The count it shows is increase()'s estimate over the minute, which extrapolates (2029 for 1902 drops in one run here)."
  UnexpectedAdmin:
    detects: an account the inventory doesn't list (alice, bob and the CM tool's netlab are listed) that opened FRR's CLI, was refused by it or ran a command on a router we own, from that router's accounting proxy; it pages at the first record and clears 60 s after the last (decision 0029)
    blind_spots:
      - "Only what goes through the accounting proxy: root reaches FRR through its own sockets and can stop the proxy, so root's commands are not seen (RISK-60)."
      - "A shell login that never opens FRR's CLI writes no record (RISK-61)."
      - "Routers we own only: fw1, h1, h2, noc and the carrier's isp have no proxy."
      - "Records are clear UDP from a port only root can send from: a lost record is never seen, and root on the router or in one of its sidecars can send one the collector takes (RISK-34, RISK-60)."
      - "It reads who, not what: a listed account running a command it shouldn't does not page."
  JobMissed:
    detects: an unattended job (drift, backup, restore drill, power drill) whose last success at the NOC's pushgateway is older than its schedule plus its 2 h grace, or that has not succeeded since the NOC started (decision 0022)
    blind_spots:
      - "A success is the job's own word: a job that reports success without doing its work does not page (RISK-44)."
      - "The pushgateway keeps the last success in memory, so a NOC restart forgets it and the clock starts again from the NOC's start (RISK-44)."
      - "The lab's NOC exists only during a CI run, so it can't see a nightly run that never starts; only the outside check at HEARTBEAT_URL can (RISK-40)."
      - "A job late by less than its grace does not page."
    beyond_review: "a false page needs a last success older than a job's schedule and grace (26 h for drift and backup, 7 days and 2 h for the drills), so nothing in a 30-minute workload could page; tests/live/observe/test_deadman.py::test_a_job_whose_last_success_is_a_window_old_pages moves a last success back by its window to show the rule pages (RISK-58)"
  Watchdog:
    detects: nothing by itself. It always fires, Alertmanager mails it to the NOC's mailbox every 10 s, and its arrival there is what AlertPathSilent reads (decision 0022)
    reads: "no metric: `vector(1)`, true at every evaluation"
    sensor: Prometheus' own rule evaluation on noc, and Alertmanager's mail to Mailpit on noc
    watches: "the alert path itself: Prometheus' rules, Alertmanager and its mail to the mailbox, all on noc"
    blind_spots:
      - "It proves mail reaches the NOC's own mailbox, not a person's inbox: the lab sends no mail beyond Mailpit."
      - "It runs inside the NOC, so a NOC that stops altogether raises nothing inside it (RISK-40); only an outside receiver of Watchdog or of the heartbeat pings would notice."
  AlertPathSilent:
    detects: no mail, Watchdog's included, has reached the NOC's mailbox for 30 s, so the mail path is broken; it pages over the webhook, the second channel (decision 0022)
    blind_spots:
      - "It reads the mailbox's report of each mail to the collector, so it waits behind the collector's own cause (logs@noc) when the collector is down."
      - "With the webhook path broken too, nothing pages (RISK-40)."
      - "At the NOC's start it counts from a minute after the start, so a mail path broken from the start pages no sooner than 90 s after it."
      - "Mailpit on noc is the end of the path: delivery to a real inbox is not tested."

# Threats no detection here sees at all. Listed so the table's silence is not read as cover.
not_detected:
  - "Logins and commands outside FRR's CLI: UnexpectedAdmin reads only the routers' accounting proxies, so a shell login (RISK-61), root's own commands (RISK-60), and any login on fw1, h1, h2, noc or isp page nothing."
  - "What fw1 drops: each rule's packets are counted, and nothing logs or alerts on them, because LOG writes nothing from a container's network namespace (docs/controls.yml, fw1:default-drop)."
  - "Traffic that never crosses fw1: r3 reaches h2's port 22 without it (tests/live/test_dataplane.py::test_firewall_blocks_ssh_to_servers proves that on every run), and host-to-host traffic inside LAN-A or LAN-B reaches no sensor."
  - "A tunnel inside ICMP, which fw1's allow-icmp forwards in both directions."
  - "Anything inside the carrier's network beyond the r2 to isp session."
