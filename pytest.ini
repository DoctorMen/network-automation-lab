[pytest]
# No traceback prints a function's arguments (the default long style for a failure's first and last
# frames does): a live test's helper may be holding this run's BGP password when a command fails.
addopts = --tb=short
markers =
    live: needs a deployed lab (make deploy)
    review: compares a record's date with today (a verdict to classify, a lever, risk or runbook due for review); `make review`, its own CI job
