- id: RISK-11
  kind: accepted-risk
  title: BFD runs at FRR's default timers and nothing alerts on a flap
  detectors: [bfd-default-timers]
  likelihood: 1
  impact: 2
  reasoning: >-
    300 ms x 3 means a router that misses three BFD packets in 0.9 s drops a healthy OSPF adjacency
    (decision 0009). Measured with r1 and r3 capped at 0.2 and 0.05 CPU, the r1-r2 session logged no
    down events, so likelihood is low here. A false drop costs about a second: traffic reroutes over the
    other core link, and the adjacency comes back on the next OSPF hello. No alert says it happened.
  compensating_control: tests/live/test_failover.py::test_silent_failure_reroutes_fast
  compensates: a dropped adjacency reroutes within 3 s over the other core link, so a false drop is a blip, not an outage
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-12
  kind: accepted-risk
  title: one edge router and one ISP link, and fw1 and r1 alone in front of LAN-A
  likelihood: 2
  impact: 3
  reasoning: >-
    There is no second edge router or ISP (decision 0009), so r2 or its ISP link failing loses internet
    access until an engineer restores it with `make apply` or redeploys r2; r2 originates its default
    with `always`, so it keeps attracting that traffic and drops it. fw1 and r1 are single points of
    failure for LAN-A, the price of a single-homed stateful firewall. LAN-A to LAN-B traffic needs r2
    only while the r1-r3 link is down. A second ISP is a cost this lab doesn't have a reason to pay.
  compensating_control: tests/live/test_routing.py::test_bgp_sessions_established
  compensates: every run checks the ISP session is up, and `make drift` names a router that differs from intent
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-13
  kind: accepted-risk
  title: fw1's conntrack picks up a TCP flow from its middle
  detectors: [conntrack-loose]
  likelihood: 2
  impact: 2
  reasoning: >-
    fw1 runs with the kernel default nf_conntrack_tcp_loose=1, so conntrack starts tracking a TCP flow
    from any packet, not only a SYN. Once an accept rule forwards one mid-stream packet, the replies pass
    allow-established as ESTABLISHED (measured: a forged ACK h1 -> 203.0.113.1:179 counted
    allow-internet 1, then the ISP's RST back counted allow-established 1; docs/controls.yml,
    fw1:allow-established). allow-web's --syn stops it for port 80, and a forged packet into LAN-A
    matches no accept rule, so it never starts a flow. It matters together with RISK-14. Setting
    nf_conntrack_tcp_loose=0 in firewall.sh would close it, at the cost of dropping connections that
    were open before conntrack forgot them (a flush or a firewall restart).
  compensating_control: tests/live/test_controls.py::test_unsolicited_inbound_ack_is_dropped
  compensates: a forged ACK into LAN-A, for a connection no user opened, still hits the default drop
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-14
  kind: accepted-risk
  title: fw1's allow-internet accepts every protocol, so it can't require --syn
  detectors: [accept-any-protocol]
  likelihood: 2
  impact: 2
  reasoning: >-
    allow-internet matches any packet from LAN-A to 203.0.113.0/24, whatever the protocol, and --syn
    needs -p tcp. So a forged mid-stream ACK from h1 to the internet range is forwarded, and conntrack
    then adopts the flow (RISK-13). It needs a host inside LAN-A that is already misbehaving, and it
    reaches only the range users may reach anyway. Splitting the rule into a TCP rule with syn: true
    plus a UDP rule would close it, at the cost of dropping the other protocols users can send now. The
    inventory check already refuses a TCP accept rule without syn: true.
  compensating_control: tests/live/test_controls.py::test_unsolicited_inbound_ack_is_dropped
  compensates: the rule only matches packets leaving LAN-A, and a forged packet coming in still hits the default drop
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-15
  kind: accepted-risk
  title: h1 and h2 are not collected, so a hand change on a host goes unseen
  detectors: [host-not-collected]
  likelihood: 2
  impact: 1
  reasoning: >-
    The hosts have no config of their own: their address and default route are the topology's exec
    lines, applied again on every deploy, and `make drift` reads back only the routers and fw1
    (docs/collection-methods.md). A hand change on a host, such as an extra route, isn't flagged. The
    hosts stand in for users and a server, enforce no policy and are rebuilt by every deploy. The fix is
    a play that reads `ip addr` and `ip route` on each host and compares them with those lines. When it
    exists, close this entry by hand: the detector reads the topology, not drift.yml.
  compensating_control: tests/live/test_dataplane.py::test_lan_a_reaches_server_lan
  compensates: every run checks what the hosts can reach, so a hand change that breaks a path fails a test
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-16
  kind: accepted-risk
  title: a fault that shows after the canary's 10 s vetting delay reaches production
  detectors: [short-vetting-delay]
  likelihood: 2
  impact: 3
  reasoning: >-
    The canary must stay healthy through the vetting delay before every other router gets the change
    (decision 0010), and the lab's delay is 10 s so CI can afford it. A fault that takes longer to show,
    such as a neighbor lost only when the 40 s OSPF dead timer runs out, or a route that leaks slowly,
    passes the canary and reaches r2, r3 and isp in one batch. A real canary soaks for hours, which a
    CI job can't. Raising vetting_delay to a minute or more closes this entry (the detector stops matching).
  compensating_control: tests/live/test_rollout.py::test_failing_canary_rolls_back_and_blocks
  compensates: a change that breaks the canary at once is rolled back there and reaches no other router
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-17
  kind: accepted-risk
  title: a production router that fails a step other than the gate rolls back alone
  detectors: [batch-rolls-back-alone]
  likelihood: 1
  impact: 3
  reasoning: >-
    After the canary, r2, r3 and isp change in one batch. If one of them fails frr-reload's apply, the
    password task or the compare with intent while the others don't, only it rolls back:
    any_errors_fatal ends the play after the rescue's first task, so the other routers keep a change
    the gate never checked, and nothing rolls them back (decision 0010; checked with mock hosts and
    ansible-core 2.21.5). The rollout exits non-zero. A rescue that rolls back the whole batch is more
    than a few lines to get right and would be untested.
  compensating_control: tests/live/test_rollout.py::test_failing_canary_rolls_back_and_blocks
  compensates: the canary has already taken the same change and passed the gate, and a failed rollout exits non-zero
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-18
  kind: accepted-risk
  title: the rollout's in-effect check fails on what was broken before the change
  detectors: [verify-without-baseline]
  likelihood: 2
  impact: 2
  reasoning: >-
    netlab.verify runs after each batch (decision 0010). Unlike the health gate it keeps no list of
    problems known before the change, so a daemon already stopped or a kernel already waiting for a
    reboot fails the rollout after the batch has changed, and nothing rolls back. On the canary that
    stops every rollout after r1; on a production router every rollout changes every router and then
    fails. Run make verify before make apply and fix what it reports first.
  compensating_control: tests/live/test_verify.py::test_daemon_patch_without_restart_is_not_in_effect
  compensates: the check itself names what is not in effect, so the failure says what to fix
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-19
  kind: accepted-risk
  title: h2's web class matches source port 80 only
  detectors: [qos-by-source-port]
  likelihood: 1
  impact: 1
  reasoning: >-
    The HTB filter puts whatever leaves h2 from port 80 in the web class (decision 0011). Bulk traffic
    sent from port 80 would get web's priority, and web served on any other port would queue as bulk.
    h2 serves web on port 80 only, and nothing else on it uses that port.
  compensating_control: tests/live/test_verify.py::test_qos_change_confirmed_from_class_counters
  compensates: every run checks that connections to h2:80 land in the web class and the rates match the inventory
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-20
  kind: accepted-risk
  title: a blackhole can be left on after the attack
  likelihood: 2
  impact: 3
  reasoning: >-
    The RTBH trigger is one static route an operator adds on r2 during an attack (decision 0012,
    docs/runbooks/ddos-rtbh.md). While it is on, the internet can't reach that host, so a trigger
    forgotten after the attack is an outage nobody is told about. The trigger is never in the intent,
    so `make drift` fails and names it while it is on (checked by hand on 2026-10-15), but only when
    drift runs. No config line holds it, so no detector can.
  compensating_control: tests/live/test_collection.py::test_unsaved_change_is_flagged
  compensates: a line on a router that isn't in its intent fails the drift check, which names it
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-21
  kind: accepted-risk
  title: nothing filters IPv6 on the internet edge
  detectors: [edge-ipv4-only]
  likelihood: 1
  impact: 2
  reasoning: >-
    r2's edge.sh writes iptables rules only, and the WAN scan is IPv4 only (decision 0012). This sandbox
    has no IPv6, but under real containerlab the links may get link-local addresses, and bgpd may then
    listen on [::]:179. Only the directly attached ISP can reach a link-local address, and BGP from it is
    allowed anyway. The fix is matching ip6tables rules in edge.sh, and a scan over IPv6.
  compensating_control: tests/live/test_edge.py::test_wan_scan_finds_only_published_ports
  compensates: over IPv4, every campus address is scanned from the internet side on every run
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-22
  kind: accepted-risk
  title: a LAN-A host can still send as another LAN-A address
  detectors: [subnet-anti-spoof]
  likelihood: 2
  impact: 2
  reasoning: >-
    fw1's raw table drops what arrives on the user side from outside 10.10.10.0/24 (decision 0012), so
    no user can send as a server or as the internet. It can't tell one user from another: that needs
    per-port binding on a switch (OROS CON-1), and the lab has no switch. A user forging a neighbour's
    address gets the same rules the neighbour has, nothing more.
  compensating_control: tests/live/test_edge.py::test_lan_a_cannot_forge_its_source
  compensates: a LAN-A host sending as a server address is dropped at fw1 on every run
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-23
  kind: accepted-risk
  title: r2 accepts every ICMP type from the internet
  detectors: [edge-icmp-any-type]
  likelihood: 2
  impact: 1
  reasoning: >-
    wan-icmp lets any ICMP from the ISP side in to r2 itself, so the carrier can ping the link and path
    MTU discovery works. Timestamp requests and other types are answered too. ICMP redirects are ignored
    because r2 forwards (the kernel's accept_redirects is off for a forwarding interface). Nothing on r2
    is reached over ICMP. The fix is --icmp-type for echo-request and the error types.
  compensating_control: tests/live/test_edge.py::test_wan_scan_finds_only_published_ports
  compensates: every TCP management port on r2 is still closed from the internet side
  owner: DoctorMen
