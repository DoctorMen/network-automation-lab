- id: RISK-7
  kind: accepted-risk
  title: the drift check ignores IPv6 forwarding
  detectors: [drift-filter]
  likelihood: 1
  impact: 1
  reasoning: >-
    `ipv6 forwarding` mirrors a kernel sysctl that differs by host (GitHub runners turn it on), and the
    lab uses no IPv6, so the line is dropped before comparing. A hand change to it would go unseen.
    IPv4 forwarding is not filtered.
  compensating_control: tests/live/test_collection.py::test_unsaved_change_is_flagged
  compensates: every other line, IPv4 forwarding included, is still compared on every run
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-8
  kind: accepted-risk
  title: the BGP password is a 0600 file, not a vault, and TCP MD5 is the only option
  detectors: [secret-file]
  likelihood: 2
  impact: 2
  reasoning: >-
    The secret store is one 0600 file per secret in a 0700 folder (.secrets/ here, $RUNNER_TEMP in CI),
    readable by the account that runs the lab; there is no vault and no GitHub secret. Root on r2 or isp
    can also print the key with `ss -tnie`. TCP MD5 (RFC 2385) is obsoleted by TCP-AO (RFC 5925), but
    FRR 8.4.1 offers only `neighbor X password`. Impact is limited: using the key needs a position on the
    r2-isp link as well, and CI makes a new random one every run.
  compensating_control: tests/test_secrets.py::test_secret_store_is_private_and_never_overwritten
  compensates: 0600 from creation, never overwritten, never printed; tests/live/test_secrets.py checks no copy appears anywhere else
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-9
  kind: refused-spend
  title: no paid GitHub secret protection for custom patterns
  likelihood: 2
  impact: 2
  reasoning: >-
    GitHub's custom secret-scanning patterns need an organization-owned repository on GitHub Team or
    Enterprise with Secret Protection; this is a personal public repo. Free gitleaks hooks and a
    full-history CI job do the same for this repo's two custom rules. What the spend would add is
    GitHub blocking at push time for everyone, even with hooks not installed or skipped.
  compensating_control: tests/test_secrets.py::test_marked_file_is_blocked_at_push_and_alerted_by_ci
  compensates: the push hook refuses a marked file, and the CI scan of the pushed history alerts if it was skipped
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-10
  kind: accepted-risk
  title: the secret scan only advises until branch protection requires it
  likelihood: 2
  impact: 3
  reasoning: >-
    `git commit --no-verify` and `git push --no-verify` skip the hooks, and main is not protected, so a
    red `secrets` job reports a leak but blocks nothing. The repository setting (require the secrets,
    offline and lab checks on main) is the owner's to turn on; it can't be set from the repo.
  compensating_control: tests/test_secrets.py::test_history_scan_finds_a_secret_committed_with_no_verify
  compensates: the history scan still finds a secret committed past the hook, on every push to any branch and nightly
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-11
  kind: accepted-risk
  title: BFD runs at FRR's default timers and nothing alerts on a flap
  detectors: [bfd-default-timers]
  likelihood: 1
  impact: 2
  reasoning: >-
    300 ms x 3 means a router that misses three BFD packets in 0.9 s drops a healthy OSPF adjacency
    (decision 0009). Measured with r1 and r3 capped at 0.2 and 0.05 CPU, the r1-r2 session logged no
    down events, so likelihood is low here. A false drop costs about a second: traffic reroutes over the
    other core link, and the adjacency comes back on the next OSPF hello. No alert says it happened.
  compensating_control: tests/live/test_failover.py::test_silent_failure_reroutes_fast
  compensates: a dropped adjacency reroutes within 3 s over the other core link, so a false drop is a blip, not an outage
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-12
  kind: accepted-risk
  title: one edge router and one ISP link, and fw1 and r1 alone in front of LAN-A
  likelihood: 2
  impact: 3
  reasoning: >-
    There is no second edge router or ISP (decision 0009), so r2 or its ISP link failing loses internet
    access until an engineer restores it with `make apply` or redeploys r2; r2 originates its default
    with `always`, so it keeps attracting that traffic and drops it. fw1 and r1 are single points of
    failure for LAN-A, the price of a single-homed stateful firewall. LAN-A to LAN-B traffic needs r2
    only while the r1-r3 link is down. A second ISP is a cost this lab doesn't have a reason to pay.
  compensating_control: tests/live/test_routing.py::test_bgp_sessions_established
  compensates: every run checks the ISP session is up, and `make drift` names a router that differs from intent
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-13
  kind: accepted-risk
  title: fw1's conntrack picks up a TCP flow from its middle
  detectors: [conntrack-loose]
  likelihood: 2
  impact: 2
  reasoning: >-
    fw1 runs with the kernel default nf_conntrack_tcp_loose=1, so conntrack starts tracking a TCP flow
    from any packet, not only a SYN. Once an accept rule forwards one mid-stream packet, the replies pass
    allow-established as ESTABLISHED (measured: a forged ACK h1 -> 203.0.113.1:179 counted
    allow-internet 1, then the ISP's RST back counted allow-established 1; docs/controls.yml,
    fw1:allow-established). allow-web's --syn stops it for port 80, and a forged packet into LAN-A
    matches no accept rule, so it never starts a flow. It matters together with RISK-14. Setting
    nf_conntrack_tcp_loose=0 in firewall.sh would close it, at the cost of dropping connections that
    were open before conntrack forgot them (a flush or a firewall restart).
  compensating_control: tests/live/test_controls.py::test_unsolicited_inbound_ack_is_dropped
  compensates: a forged ACK into LAN-A, for a connection no user opened, still hits the default drop
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-14
  kind: accepted-risk
  title: fw1's allow-internet accepts every protocol, so it can't require --syn
  detectors: [accept-any-protocol]
  likelihood: 2
  impact: 2
  reasoning: >-
    allow-internet matches any packet from LAN-A to 203.0.113.0/24, whatever the protocol, and --syn
    needs -p tcp. So a forged mid-stream ACK from h1 to the internet range is forwarded, and conntrack
    then adopts the flow (RISK-13). It needs a host inside LAN-A that is already misbehaving, and it
    reaches only the range users may reach anyway. Splitting the rule into a TCP rule with syn: true
    plus a UDP rule would close it, at the cost of dropping the other protocols users can send now. The
    inventory check already refuses a TCP accept rule without syn: true.
  compensating_control: tests/live/test_controls.py::test_unsolicited_inbound_ack_is_dropped
  compensates: the rule only matches packets leaving LAN-A, and a forged packet coming in still hits the default drop
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-15
  kind: accepted-risk
  title: h1 and h2 are not collected, so a hand change on a host goes unseen
  detectors: [host-not-collected]
  likelihood: 2
  impact: 1
  reasoning: >-
    The hosts have no config of their own: their address and default route are the topology's exec
    lines, applied again on every deploy, and `make drift` reads back only the routers and fw1
    (docs/collection-methods.md). A hand change on a host, such as an extra route, isn't flagged. The
    hosts stand in for users and a server, enforce no policy and are rebuilt by every deploy. The fix is
    a play that reads `ip addr` and `ip route` on each host and compares them with those lines. When it
    exists, close this entry by hand: the detector reads the topology, not drift.yml.
  compensating_control: tests/live/test_dataplane.py::test_lan_a_reaches_server_lan
  compensates: every run checks what the hosts can reach, so a hand change that breaks a path fails a test
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null
