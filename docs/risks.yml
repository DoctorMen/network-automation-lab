- id: RISK-61
  kind: accepted-risk
  title: a shell login that never opens FRR's CLI is recorded nowhere
  detectors: [shell-login-unrecorded]
  likelihood: 3
  impact: 2
  reasoning: >-
    The routers have no sshd or login daemon; a person reaches one through the host's console (`docker exec`,
    then su to their account), which writes no login record. UnexpectedAdmin reads the proxy's lines, so an
    unlisted account pages when it opens FRR's CLI or is refused by the proxy, not when it only runs shell
    commands. Without root those can't change routing, filters or FRR's config: the iptables and FRR sockets
    need root or frrvty. The fix is sshd with its own log lines at the NOC, which a later build adds (OROS ACC-3).
  compensating_control: tests/live/observe/test_accounting.py::test_an_account_not_on_the_list_pages_and_a_listed_one_does_not
  compensates: an unlisted account pages the moment it touches FRR, in the admin group or not
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-62
  kind: accepted-risk
  title: the drift check matches records by a command's text, not its stanza or its result
  likelihood: 2
  impact: 2
  reasoning: >-
    `make drift` names who set each differing line from the command records (decision 0030): the newest
    record of the same command decides, and is named only if it set the running value, or for a missing
    line removed or replaced the intended one. A record holds the command as typed, not the interface or
    stanza it was typed under, nor whether the daemon accepted it. So the same command typed since under
    another interface can name the wrong person, or hide the record that did set the line and name no one,
    and a command the daemon refused can be named. A change made outside the proxy (RISK-60) names no one,
    and says so. The fix is to keep each session's context with its records (the proxy sees every line of
    the session, under one pid) and the daemon's answer to each command.
  compensating_control: tests/live/observe/test_accounting.py::test_drift_names_whoever_set_the_running_value_last
  compensates: with two people changing the same line, the one whose value is running is named, not the other, and a value root set again after `make apply` names no one
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-63
  kind: accepted-risk
  title: the translation log can lose a translation, and records only when each began
  detectors: [nat-log-start-only]
  likelihood: 2
  impact: 3
  reasoning: >-
    r2's translation log (decision 0031) is conntrack's NEW events sent as syslog over UDP: a line lost on the
    way or dropped by conntrack itself when its netlink buffer overflows under load is gone, and a complaint
    about that translation names no one. A dead log pages as SourceSilent within twice its heartbeat (measured
    once by hand: 93 s after its last line, bound 120 s); a single lost line is not detected (RISK-34). It
    records when a translation began, not when it ended, so an outside
    port reused for a different far end is told apart only when the complaint gives the far end's address and
    port, and `make whois` looks back an hour by default. It takes a translation stamped at most 2 s after the
    complaint's time (--skew), which fits the lab's one clock: a complainant whose clock runs further behind
    r2's is told nobody held the port until --skew is widened. The fix is DESTROY events too, a sender with a
    queue (or the kernel's own NAT log, sent by a TCP or TLS forwarder), longer lookups against the 720 h
    store, and a skew taken from how far off the complainant's clock is known to be.
  compensating_control: tests/live/observe/test_whois.py::test_the_same_inside_port_from_two_hosts_names_each_by_its_own_outside_port
  compensates: two inside hosts on the same inside port to the same far end are each named by their own outside port
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-64
  kind: accepted-risk
  title: the drift check reads the edge routers' filters as root
  detectors: [drift-play-as-root]
  likelihood: 1
  impact: 2
  reasoning: >-
    The FRR half of `make drift` and all of `make apply` run as the CM tool's own account (decision 0029), so
    their commands are recorded. iptables needs root, and the kernel's tables have no accounting of their own,
    so the play that reads r2's and r3's filters and NAT runs as root, like the console. It only reads
    (iptables -S and iptables-save) and replays the intent in a separate, empty network namespace. The fix is a
    sudo rule letting the CM tool's account run iptables -S and iptables-save only, logged like its FRR commands.
  compensating_control: tests/live/test_edge.py::test_edge_filter_hand_change_is_flagged
  compensates: any change to the filters or the NAT, by whoever made it, fails the drift check, which names it
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-65
  kind: accepted-risk
  title: the switch is set at deploy and read back by nothing
  detectors: [switch-not-collected]
  likelihood: 2
  impact: 3
  reasoning: >-
    sw1's bridge, its ports' VLANs and its storm control come from build/sw1/switch.sh, read-only intent like
    fw1's firewall.sh (decision 0032). But `make drift` collects routers and the firewall, not the switch, and no
    exporter runs on sw1: a port moved to another VLAN by hand, a storm control rule deleted with `make release`
    and never put back, or a bridge nobody re-created after a restart, is seen only by the next live test or the
    next `make trace`. The fix is a drift play for sw1 (bridge vlan show and ebtables-save against the intent,
    as compare_rules does for iptables) and node_exporter in sw1's namespace for the port counters.
  compensating_control: tests/live/test_storm.py::test_storm_contained_not_shut
  compensates: a port without its storm control, or a bridge not forwarding, fails the test on every CI run; and the test puts the rules back as found
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-66
  kind: accepted-risk
  title: one VLAN, and VLAN filtering only where the kernel has it
  detectors: [bridge-vlan-fallback]
  likelihood: 3
  impact: 2
  reasoning: >-
    sw1 has one VLAN (10, LAN-A) and no trunk, so "which VLAN" has one answer and inter-VLAN routing is untested.
    The bridge asks the kernel for VLAN filtering; the sandbox kernel refuses it (V-033) and switch.sh falls back
    to a plain bridge, writing the fact to /run/switch.state. Where that happens, `netlab where` answers the port
    and the role but no VLAN, and tests/live/test_where.py::test_the_answer_names_the_vlan skips rather than
    pretends. GitHub's runner kernel is expected to have it; the first green run there is the proof, and until
    then the VLAN half of FND-4 is proved on no kernel. The fix is a second VLAN with a trunk to fw1 (the README's
    roadmap item), on a kernel that filters.
  compensating_control: tests/live/test_where.py::test_moved_host_found_on_new_port
  compensates: the port and the role are proved on every kernel; the VLAN test is skipped with its reason where the kernel can't, never passed
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-67
  kind: accepted-risk
  title: the lab's DNS is served, but nothing resolves with it
  detectors: [dns-unresolved]
  likelihood: 3
  impact: 1
  reasoning: >-
    CoreDNS on the NOC serves every name the inventory implies (decision 0032), on plain UDP and TCP 53, one
    server. Every node keeps Docker's own resolv.conf, so the tests query it by address, and fw1 admits only the
    web and the internet from LAN-A, so a user there can't ask it at all. The NOC probes it with nothing, and a
    dead server pages nobody. It proves that names are generated from the record, which is what FND-4 asks; it is
    not the resolver the lab runs on. The fix is a resolv.conf rendered into each node, an allow-dns rule on fw1
    for the NOC's port 53, and a blackbox dns probe.
  compensating_control: tests/live/observe/test_dns.py::test_every_inventory_name_resolves_to_its_address
  compensates: every name and reverse name is checked against the inventory on every observe-1 run, so a dead or wrong server fails CI
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-68
  kind: accepted-risk
  title: storm control polices broadcast only
  detectors: [broadcast-only-policer]
  likelihood: 2
  impact: 3
  reasoning: >-
    The per-port limit matches frames to ff:ff:ff:ff:ff:ff (decision 0034). A multicast storm, or unknown-unicast
    flooding from a host sending to addresses the bridge has not learned, is flooded to every port of the VLAN the
    same way and is not policed. A real switch's storm control covers all three. The fix is two more rule pairs
    per edge port: a multicast match (ebtables --dst Multicast) and, for unknown unicast, a limit on frames the
    bridge floods, which ebtables can't tell from forwarded ones in PREROUTING; that needs the bridge's
    flood counters or a BROUTING trick, and was not built.
  compensating_control: tests/live/test_storm.py::test_storm_contained_not_shut
  compensates: the broadcast case, the lab's storm, is held to the limit on every CI run
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-69
  kind: accepted-risk
  title: the listener audit sees TCP on hosts, as often as CI runs
  detectors: [audit-tcp-hosts-only]
  likelihood: 3
  impact: 2
  reasoning: >-
    `make audit` reads `ss -ltnpH` on every host we own (decision 0032): TCP listeners only, so a UDP service
    nobody recorded (the NOC's syslog on 514 and its DNS on 53 are UDP too) is not in the report; hosts only, so
    a router's listeners are checked by tests/live/test_management_plane.py against a rule (localhost, BGP, the
    exporters), not against a record; and it runs when CI's lab job runs, nightly and on every push, not
    continuously. A listener started and stopped between runs is never seen. The fix is `ss -lunpH` beside the
    TCP read with the inventory naming each host's UDP services, the routers' expected listeners generated into
    the same report, and a scheduled run on the NOC.
  compensating_control: tests/live/test_where.py::test_unrecorded_service_on_next_audit
  compensates: an unrecorded TCP listener on a host is in the next report on every CI run, and the stand-in on h2's port 22 is named by its program
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null
