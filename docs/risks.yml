- id: RISK-40
  kind: accepted-risk
  title: the NOC watches itself, so its own death raises nothing inside it
  likelihood: 2
  impact: 3
  reasoning: >-
    JobMissed and AlertPathSilent run on the NOC's own Prometheus and page through its own Alertmanager,
    and the mailbox that proves the mail path sits on the same host (decision 0022). If Prometheus,
    Alertmanager or the whole NOC stops, neither can fire. Only a receiver outside the NOC that expects
    the pings would notice. HEARTBEAT_URL is that receiver, for the jobs and the nightly run, but nobody
    has set it up yet, and nothing outside the lab expects the Watchdog. The mail path outside the NOC
    (a relay, a provider) is not in the lab.
  compensating_control: tests/test_jobs.py::test_success_without_a_noc_warns_and_still_pings_the_heartbeat
  compensates: a job's success still pings HEARTBEAT_URL when the NOC can't take it, so an outside check sees the job even with the NOC down
  owner: DoctorMen
