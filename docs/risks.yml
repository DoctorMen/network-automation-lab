- id: RISK-30
  kind: accepted-risk
  title: the rollback of a failed change to a BGP neighbor itself brings the neighbor back without its password
  detectors: [rollback-without-password]
  likelihood: 2
  impact: 4
  reasoning: >-
    The fallback is saved with its password lines dropped, so no password is on the router's disk and a
    rollback leaves a password as it is (decision 0016). A change to the neighbor itself (its remote-as
    or address, or the local AS) is different: frr-reload.py deletes the neighbor, password and all, and
    re-creates it, and the rollback then re-creates the old one from a fallback that has no password
    line. Against a carrier that keeps its key, the session stays down until the inventory is reverted
    and `make apply` runs. Seen in the lab on 2026-10-16: a wrong remote-as on r2 failed the gate, the
    rollback put the right remote-as back with no MD5, and the session stayed in Connect until make
    apply. Setting the passwords again in the rescue would cover a new remote-as, but not a renumbered
    neighbor, whose old address has no secret in the new inventory.
  compensating_control: tests/live/test_secrets.py::test_bgp_session_uses_its_secret_and_a_wrong_one_drops_it
