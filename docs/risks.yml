- id: RISK-25
  kind: accepted-risk
  title: GitHub can stop the nightly backups, the weekly drills and the control check together
  detectors: [scheduled-workflow]
  likelihood: 3
  impact: 3
  reasoning: >-
    In a public repository GitHub disables scheduled workflows after 60 days without activity, and a
    person must enable them again. Then the nightly CI run (and its backup), the weekly restore and
    power drills and the control-status check all stop, and nothing says so: the check that would
    notice runs in the workflow that stopped (decision 0014). A dead-man's switch outside GitHub would
    catch it, but the lab has no always-on host to run one. Likely for a repository that goes quiet.
  compensating_control: tests/test_control_status.py::test_latest_green_older_than_its_period_fails
  compensates: >-
    the next push to main runs ci.yml's control-status job, which fails naming every control whose
    latest result is older than its period (31 days, 90 for the restore drill); nothing runs when
    nothing at all happens in the repository
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-26
  kind: accepted-risk
  title: of two CI runs at once, one run's backup snapshot is lost
  detectors: [backup-cache-per-run]
  likelihood: 2
  impact: 1
  reasoning: >-
    Each run restores the newest copy of the restic repository from the Actions cache, adds its
    snapshot and saves the result under its own key (decision 0014). Two runs at once (the nightly run
    and a push) start from the same copy, and the next run restores only the newer of the two saves,
    so the other run's snapshot is gone. Everything before it is intact, and it holds configs that the
    next night's snapshot holds again. A concurrency group would queue the runs, but it also cancels a
    queued run when a third arrives.
  compensating_control: tests/live/test_restore.py::test_latest_backup_is_recent
  compensates: one snapshot is lost, not the repository; if backups stop altogether the restore drill fails when the newest is 36 hours old
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-27
  kind: accepted-risk
  title: one router restarting while its neighbours stay up is never drilled
  likelihood: 3
  impact: 2
  reasoning: >-
    The power drill restarts the whole lab at once (decision 0015). A Containerlab node restarted on
    its own comes back without its links on both ends, so a single router's crash or upgrade restart,
    the more common event, can't be drilled here. What it would show is how its neighbours handle it
    going away and coming back. No config line holds it, so no detector can.
  compensating_control: tests/live/test_failover.py::test_silent_failure_reroutes_fast
  compensates: >-
    to its neighbours a router that stops is links that stop answering, which is drilled: BFD drops it
    in about a second and traffic takes the other path; that a router comes back from its startup
    config is the power drill's
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-28
  kind: accepted-risk
  title: after a power cut or restart the BGP password is gone until someone runs `make apply`
  detectors: [password-runtime-only]
  likelihood: 2
  impact: 4
  reasoning: >-
    The password is set through vtysh's stdin and is in no startup config (decision 0016), so a router
    that restarts comes back without it. Against a real carrier, which keeps its key, the session stays
    down and the campus has no internet until a person runs `make apply` (step 3 of the power-event
    runbook); nothing runs it by itself. In the lab both ends lose it, and the session came back in 7 s
    with no MD5 on either end (2026-10-15), so it runs unauthenticated until then. Putting the
    password in the startup config would put it in clear in the one folder that must be safe to print.
  compensating_control: tests/live/test_power_event.py::test_power_event_recovers_from_startup_config
  compensates: >-
    the weekly drill cuts the power, runs `make apply` as the runbook says, and fails unless the session
    comes back with authentication enabled on both ends
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-29
  kind: accepted-risk
  title: the backup repository's password is kept beside it in the Actions cache
  detectors: [backup-password-in-cache]
  likelihood: 3
  impact: 1
  reasoning: >-
    No repository secret can be set from here, so drills.yml's one-time init writes a random restic
    password into the same cache as the repository (decision 0014). Any workflow run in this repository
    can restore that cache, a pull request's own copy of a workflow included, and so read every backup.
    Impact is low because the backups hold configs rendered from the public inventory, with the BGP
    password only as the sha256 tag of 128 random bits. A pull request's run can't write main's cache.
  compensating_control: tests/test_backup.py::test_a_capture_holding_a_password_is_never_sent
  compensates: >-
    the repository can only ever hold the redacted capture: `make backup` refuses a capture holding a
    lab secret in clear before restic runs, and searches every file it reads back from the snapshot
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

# The NOC (decision 0018) and the central log store (decision 0019).
- id: RISK-30
  kind: accepted-risk
  title: the NOC watches in band, so a dead link blinds it to what is behind
  likelihood: 3
  impact: 2
  reasoning: >-
    noc sits on its own LAN behind r2 (10.30.30.0/24), and every scrape, probe and log line crosses the
    campus links it watches. Decision 0007 took the management network away because Docker's default
    route leaked traffic, and a second LAN only for monitoring would hide the failures users see. When
    r2 or the r1-r2 and r2-r3 links fail together, the NOC loses its view of r1, r3, fw1 and h2 at once:
    each pages on its own (TargetDown, the per-object rules on absent(), SourceSilent), so the cause is
    one page among many. Decision 0021 now holds back what depends on a failed device or link, so it
    pages once (RISK-42, RISK-43).
  compensating_control: tests/test_monitoring.py::test_state_rules_catch_admin_down_and_a_missing_series
  compensates: a series the NOC stops receiving pages as down, so blindness is never silence
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-31
  kind: accepted-risk
  title: the exporters and the NOC's endpoints have no TLS and no password
  detectors: [exporter-plain-http]
  likelihood: 2
  impact: 2
  reasoning: >-
    frr_exporter and node_exporter answer plain HTTP on each router's loopback, which OSPF carries to the
    whole campus, so any host that reaches a loopback reads the routing table, BGP peers, interface
    counters and kernel version. Nothing they serve is a secret (the BGP password is not in any metric),
    and they can't be written to over HTTP. Prometheus, Alertmanager, blackbox and Loki answer on
    127.0.0.1 inside noc only. The collector's syslog and forwarder ports take lines from anyone on the
    campus (RISK-33). The fix is exporter-toolkit's --web.config.file with TLS and basic auth, and the
    same on Prometheus' scrape configs.
  compensating_control: tests/live/test_management_plane.py::test_router_daemons_listen_on_localhost_only
  compensates: each router answers on the campus only for BGP and its two exporters on its loopback, and noc only on its sources' ports (test_noc_listens_on_the_campus_only_for_its_sources)
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-32
  kind: accepted-risk
  title: frr_exporter holds FRR's vty sockets, which accept config commands
  detectors: [vty-socket-shared]
  likelihood: 1
  impact: 3
  reasoning: >-
    frr_exporter reads FRR's state the documented way, JSON over each daemon's vty socket in
    /var/run/frr. The folder is mounted read-only into its sidecar, but a read-only mount doesn't stop a
    connect() to a socket, and FRR's vty takes `configure terminal` from whoever connects. A compromised
    or malicious exporter image could change routing. The image is pinned by tag and its digest is
    checked against the inventory on every observe run, it runs nothing but the exporter, and a change
    it made by hand would show as drift. FRR has no read-only vty, so the fix is a different collector
    (a polling sidecar that holds the sockets, with the exporter outside).
  compensating_control: tests/live/test_collection.py::test_unsaved_change_is_flagged
  compensates: a config change made through vtysh that intent doesn't hold fails the drift check, which names the line
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-33
  kind: accepted-risk
  title: syslog crosses the campus as clear UDP, so lines can be lost or forged
  detectors: [syslog-udp]
  likelihood: 2
  impact: 2
  reasoning: >-
    busybox syslogd, the only syslog daemon in the router image, sends each line once over UDP 514 with
    no acknowledgement, queue or authentication (RFC 5426). A congested or dead link loses the lines
    behind it for good, and any host on the campus can send a line naming any router's address. The
    collector names a line by its source address only. A whole stream lost pages as SourceSilent within
    twice its heartbeat; a single lost line, or a forged one, is not detected. The fix is a TLS syslog
    sender (RFC 5425) in a sidecar, reading FRR's lines from a socket rather than the image's syslogd.
  compensating_control: tests/live/observe/test_arrival.py::test_blocked_source_raises_source_silent_and_comes_back_without_a_restart
  compensates: a source whose lines stop arriving pages within twice its heartbeat, and its own counters can't hide it
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-34
  kind: accepted-risk
  title: the central log store is one copy inside noc's container
  detectors: [log-store-in-container]
  likelihood: 3
  impact: 2
  reasoning: >-
    Loki keeps its chunks and index in /loki inside the noc-loki container, with nothing bound from the
    host and nothing copied off it. A redeploy or `make destroy` starts it empty, and a disk fault loses
    the 720 h it keeps. For a lab that is rebuilt on every CI run that is the normal life of the store;
    a real NOC would keep it on durable storage, replicated, and longer than 720 h if PCI DSS 10.5.1's
    12 months applied (decision 0013 keeps that scope a toy). The boxes keep only 16 KB and one rotated
    file each, by design, so the store is the only history.
  compensating_control: none (nothing backs the store up; the boxes' own rotated copy is the only other history)
  compensates: nothing; while noc is up, it holds every line the boxes have already rotated away
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-35
  kind: accepted-risk
  title: h1, a user's machine, sends no logs
  likelihood: 2
  impact: 1
  reasoning: >-
    Every router, firewall and server we own sends syslog to the NOC, and h2's web app its own log; h1 is
    a user's machine on LAN-A, which a NOC doesn't run a forwarder on. What it does on the network is
    seen at fw1, its only way out, whose own lines (and later its connection and NAT logs, OROS FND-5)
    reach the store. A compromise on h1 that never crosses fw1 is not logged anywhere central.
  compensating_control: tests/live/observe/test_arrival.py::test_synthetic_event_from_every_source_reaches_the_store
  compensates: fw1, LAN-A's only way out, is a source, and its test event reaches the store on every observe run
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-40
  kind: accepted-risk
  title: the NOC watches itself, so its own death raises nothing inside it
  likelihood: 2
  impact: 3
  reasoning: >-
    JobMissed and AlertPathSilent run on the NOC's own Prometheus and page through its own Alertmanager,
    and the mailbox that proves the mail path sits on the same host (decision 0022). If Prometheus,
    Alertmanager or the whole NOC stops, neither can fire. Only a receiver outside the NOC that expects
    the pings would notice. HEARTBEAT_URL is that receiver, for the jobs and the nightly run, but nobody
    has set it up yet, and nothing outside the lab expects the Watchdog. The mail path outside the NOC
    (a relay, a provider) is not in the lab.
  compensating_control: tests/test_jobs.py::test_success_without_a_noc_warns_and_still_pings_the_heartbeat
  compensates: a job's success still pings HEARTBEAT_URL when the NOC can't take it, so an outside check sees the job even with the NOC down
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-41
  kind: accepted-risk
  title: a silence added by hand in Alertmanager skips the file's checks until make silence runs
  likelihood: 2
  impact: 2
  reasoning: >-
    Alertmanager takes any silence through its API, amtool or its web page, however wide and however
    long. monitoring/silences.yml and its checks (decision 0020) hold only the silences written there.
    Nothing stops a person on shift from silencing a whole router by hand; make silence then names it and
    fails, but only when someone runs it or make deploy runs it. Closing the API to everyone but make
    silence would need a proxy in front of Alertmanager.
  compensating_control: tests/test_silence.py::test_a_silence_added_by_hand_is_reported
  compensates: make silence lists every active silence the file doesn't hold, with who set it and when it ends, and fails
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-42
  kind: accepted-risk
  title: a real failure behind a cause waits until the cause has cleared
  likelihood: 2
  impact: 2
  reasoning: >-
    While a cause fires, every alert that lists it in deps is held back (decision 0021), whether it
    follows from the cause or is a second failure behind it. A cause's page keeps firing 75 s after it
    recovers, so the dependents still recovering behind it don't page. A failure that is still true then
    pages, up to 75 s later than it would have on its own. Telling the two apart needs a view from
    beyond the cause, which an in-band NOC doesn't have (RISK-30).
  compensating_control: tests/live/observe/test_outage.py::test_a_parent_failure_pages_once_and_a_killed_service_pages_again
  compensates: a failure on a part that doesn't depend on the cause still pages at once, and nothing held back pages late once the cause has cleared
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-43
  kind: accepted-risk
  title: the NOC's own uplink pages as its first hop, and the NOC's services are outside the dependency model
  likelihood: 2
  impact: 1
  reasoning: >-
    The dependency graph runs from noc, so the link from noc to r2 has no far end the NOC can watch past
    it: when it fails, everything goes quiet behind r2, and the one page is NodeDown for r2. blackbox,
    Prometheus and Alertmanager run beside noc and are not vertices in the graph; blackbox down pages
    once for each job it serves.
  compensating_control: tests/test_dependencies.py::test_dependencies_come_from_the_inventory_graph
  compensates: r2, the NOC's first hop, covers every other device in the model, so a dead uplink is still one page
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-44
  kind: accepted-risk
  title: a job's success is its own word, and the pushgateway keeps it in memory
  likelihood: 2
  impact: 2
  reasoning: >-
    Each unattended job's last make line pushes its success to the pushgateway (decision 0022). Make
    runs it only after every earlier line succeeded, but a job whose steps pass while doing too little
    still reports success. The pushgateway keeps what was pushed in memory, so a redeploy starts it empty
    and the window then counts from the NOC's start: a job that never ran since pages one window later.
  compensating_control: tests/test_jobs.py::test_every_job_reports_success_as_its_last_step
  compensates: each job's success line is the last line of its make target, so a failed step sends nothing
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null
