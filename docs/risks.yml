- id: RISK-28
  kind: accepted-risk
  title: after a power cut or restart the BGP password is gone until someone runs `make apply`
  detectors: [password-runtime-only]
  likelihood: 2
  impact: 4
  reasoning: >-
    The password is set through vtysh's stdin and is in no startup config (decision 0016), so a router
    that restarts comes back without it. Against a real carrier, which keeps its key, the session stays
    down and the campus has no internet until a person runs `make apply` (step 3 of the power-event
    runbook); nothing runs it by itself. In the lab both ends lose it, and the session came back in 7 s
    with no MD5 on either end (2026-10-15), so it runs unauthenticated until then. Putting the
    password in the startup config would put it in clear in the one folder that must be safe to print.
  compensating_control: tests/live/test_power_event.py::test_power_event_recovers_from_startup_config
  compensates: >-
    the weekly drill cuts the power, runs `make apply` as the runbook says, and fails unless the session
    comes back with authentication enabled on both ends
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-29
  kind: accepted-risk
  title: the backup repository's password is kept beside it in the Actions cache
  detectors: [backup-password-in-cache]
  likelihood: 3
  impact: 1
  reasoning: >-
    No repository secret can be set from here, so drills.yml's one-time init writes a random restic
    password into the same cache as the repository (decision 0014). Any workflow run in this repository
    can restore that cache, a pull request's own copy of a workflow included, and so read every backup.
    Impact is low because the backups hold configs rendered from the public inventory, with the BGP
    password only as the sha256 tag of 128 random bits. A pull request's run can't write main's cache.
  compensating_control: tests/test_backup.py::test_a_capture_holding_a_password_is_never_sent
  compensates: >-
    the repository can only ever hold the redacted capture: `make backup` refuses a capture holding a
    lab secret in clear before restic runs, and searches every file it reads back from the snapshot
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null
