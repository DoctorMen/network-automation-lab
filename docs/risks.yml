# Risk register (OROS JUS-4): every deliberate shortcut and refused spend in the lab, with why it is
# accepted. likelihood and impact run 1 (rare, trivial) to 5 (expected, severe), for this lab as it is.
# `detectors` tie an entry to the config lines it accepts: `make risks` (netlab/risks.py) fails on a risky
# line no entry covers, and on an entry whose lines are gone, so the register can't drift from the config.
# presented_to stays "pending" until someone in a management role has seen the entry; then set the date
# and a link to the record (a PR review, an issue, meeting notes). netlab can't make that true, only list
# what is still pending.
# Every review_by is 2027-01-15 on purpose: the register is reviewed as a whole, so on 2027-01-16
# `make review`, `make risks` and CI's review job all go red together, until each entry has been looked
# at again and given its next date. The lab job doesn't wait for the review job, so the live tests and
# the backup keep running meanwhile.

- id: RISK-1
  kind: accepted-risk
  title: r2 accepts any route the carrier sends
  detectors: [ebgp-no-policy]
  likelihood: 2
  impact: 3
  reasoning: >-
    `no bgp ebgp-requires-policy` with no inbound prefix-list or route-map, so r2 installs whatever the
    carrier announces. A more-specific such as 10.20.20.0/25 (a carrier mistake or a hijack upstream)
    would win by longest match on r2. r2 doesn't redistribute BGP into OSPF; it only originates a
    default, so r1 and r3 keep their own routes. But traffic r2 forwards would follow it: replies to the
    internet, and LAN-A to LAN-B traffic while the r1-r3 link is down, which runs through r2. Likelihood
    is low because one carrier peer sends one /24. isp has the same line; it is the carrier stand-in's
    config, not ours. The fix is an inbound prefix-list on r2 allowing the carrier's /24 and a default.
  compensating_control: none (nothing limits what the real carrier sends. A leak or an upstream hijack arrives over the authenticated session, so MD5, tests/live/test_secrets.py::test_bgp_session_uses_its_secret_and_a_wrong_one_drops_it, stops only a spoofed peer. Accepted on likelihood, one peer sending one /24)
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-2
  kind: accepted-risk
  title: every lab node runs as a privileged container
  detectors: [privileged-node]
  likelihood: 1
  impact: 4
  reasoning: >-
    Containerlab 0.68.0 starts every node with Privileged true
    (https://github.com/srl-labs/containerlab/blob/v0.68.0/runtime/docker/docker.go#L510), and the
    stand-in used where Containerlab can't run does the same. Root inside a privileged container is close
    to root on the host. Likelihood is low: the nodes run only the pinned FRR image, nothing untrusted is
    executed in them, and CI runs on a throwaway runner. On a shared laptop the impact is the laptop.
  compensating_control: tests/live/test_platform.py::test_running_version_matches_inventory
  compensates: every run checks the nodes still run the exact pinned image and versions
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-3
  kind: accepted-risk
  title: OSPF has no authentication
  detectors: [ospf-no-auth]
  likelihood: 1
  impact: 3
  reasoning: >-
    Any device that can send OSPF hellos on a core link could form an adjacency and inject routes. The
    core links are point-to-point veth pairs with nothing else on them, and OSPF is passive on both host
    LANs, so a host can't speak OSPF to a router. Adding keys would add a second secret to deliver the
    way decision 0016 delivers the BGP one.
  compensating_control: tests/live/test_routing.py::test_host_lans_are_passive
  compensates: no OSPF hellos on the host LANs, so the only devices that can reach OSPF are the routers
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-4
  kind: accepted-risk
  title: fw1 forwards every ICMP type
  detectors: [icmp-any-type]
  likelihood: 2
  impact: 1
  reasoning: >-
    allow-icmp accepts all ICMP in both directions, so redirects, timestamp requests and ICMP tunnels
    pass as well as echo, time-exceeded and unreachable, which `make locate` and path MTU discovery need.
    Impact is low: ICMP carries no service here, and every TCP and UDP port not listed is still dropped.
    The fix is matching --icmp-type for the types the lab uses.
  compensating_control: tests/live/test_controls.py::test_default_drop_blocks_unlisted_port
  compensates: everything that isn't ICMP and isn't listed still hits the default drop
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

