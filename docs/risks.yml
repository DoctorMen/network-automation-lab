- id: RISK-25
  kind: accepted-risk
  title: GitHub can stop the nightly backups, the weekly drills and the control check together
  detectors: [scheduled-workflow]
  likelihood: 3
  impact: 3
  reasoning: >-
    In a public repository GitHub disables scheduled workflows after 60 days without activity, and a
    person must enable them again. Then the nightly CI run (and its backup), the weekly restore and
    power drills and the control-status check all stop, and nothing says so: the check that would
    notice runs in the workflow that stopped (decision 0014). A dead-man's switch outside GitHub would
    catch it, but the lab has no always-on host to run one. Likely for a repository that goes quiet.
  compensating_control: tests/test_control_status.py::test_latest_green_older_than_its_period_fails
  compensates: >-
    the next push to main runs ci.yml's control-status job, which fails naming every control whose
    latest result is older than its period (31 days, 90 for the restore drill); nothing runs when
    nothing at all happens in the repository
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-26
  kind: accepted-risk
  title: of two CI runs at once, one run's backup snapshot is lost
  detectors: [backup-cache-per-run]
  likelihood: 2
  impact: 1
  reasoning: >-
    Each run restores the newest copy of the restic repository from the Actions cache, adds its
    snapshot and saves the result under its own key (decision 0014). Two runs at once (the nightly run
    and a push) start from the same copy, and the next run restores only the newer of the two saves,
    so the other run's snapshot is gone. Everything before it is intact, and it holds configs that the
    next night's snapshot holds again. A concurrency group would queue the runs, but it also cancels a
    queued run when a third arrives.
  compensating_control: tests/live/test_restore.py::test_latest_backup_is_recent
  compensates: one snapshot is lost, not the repository; if backups stop altogether the restore drill fails when the newest is 36 hours old
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-27
  kind: accepted-risk
  title: one router restarting while its neighbours stay up is never drilled
  likelihood: 3
  impact: 2
  reasoning: >-
    The power drill restarts the whole lab at once (decision 0015). A Containerlab node restarted on
    its own comes back without its links on both ends, so a single router's crash or upgrade restart,
    the more common event, can't be drilled here. What it would show is how its neighbours handle it
    going away and coming back. No config line holds it, so no detector can.
  compensating_control: tests/live/test_failover.py::test_silent_failure_reroutes_fast
  compensates: >-
    to its neighbours a router that stops is links that stop answering, which is drilled: BFD drops it
    in about a second and traffic takes the other path; that a router comes back from its startup
    config is the power drill's
  owner: DoctorMen
