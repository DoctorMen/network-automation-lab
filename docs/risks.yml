  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-24
  kind: accepted-risk
  title: r3's reverse-path filter is a sysctl that `make drift` doesn't read back
  detectors: [sysctl-not-collected]
  likelihood: 1
  impact: 2
  reasoning: >-
    edge.sh sets strict rp_filter on r3's LAN-B interface with sysctl (decision 0012). The drift check
