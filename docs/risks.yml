  presented_evidence: null

- id: RISK-42
  kind: accepted-risk
  title: a real failure behind a cause waits until the cause has cleared
  likelihood: 2
  impact: 2
  reasoning: >-
    While a cause fires, every alert that lists it in deps is held back (decision 0021), whether it
    follows from the cause or is a second failure behind it. A cause's marker keeps firing 75 s after it
    recovers, so the dependents still recovering behind it don't page. A failure that is still true then
    pages, up to 75 s later than it would have on its own. A cause seen for a single scrape (one lost
    ping, one slow scrape) holds back for those 75 s everything that lists it with no page of its own,
    so a short alert behind it in that time, such as a flap on a port of the router behind, would never
    be paged (read from the rules, not measured). A flap never waits behind its own link, so the short
    outage of a link itself still pages, and a queue's drops never wait behind their own node, whose ping
    the same burst can drop (V-031).
    Telling the two apart needs a view from beyond the cause, which an in-band NOC doesn't have (RISK-31).
  compensating_control: tests/live/observe/test_outage.py::test_a_parent_failure_pages_once_and_a_killed_service_pages_again
  compensates: a failure on a part that doesn't depend on the cause still pages at once, and nothing held back pages late once the cause has cleared
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-43
  kind: accepted-risk
  title: the NOC's own uplink pages as its first hop, and the NOC's services are outside the dependency model
  likelihood: 2
  impact: 1
  reasoning: >-
    The dependency graph runs from noc, so the link from noc to r2 has no far end the NOC can watch past
    it: when it fails, everything goes quiet behind r2, and the one page is NodeDown for r2. blackbox,
    Prometheus and Alertmanager run beside noc and are not vertices in the graph; blackbox down pages
    once for each job it serves.
  compensating_control: tests/test_dependencies.py::test_dependencies_come_from_the_inventory_graph
  compensates: r2, the NOC's first hop, covers every other device in the model, so a dead uplink is still one page
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-44
  kind: accepted-risk
  title: a job's success is its own word, and the pushgateway keeps it in memory
  likelihood: 2
  impact: 2
  reasoning: >-
    Each unattended job's last make line pushes its success to the pushgateway (decision 0022). Make
    runs it only after every earlier line succeeded, but a job whose steps pass while doing too little
    still reports success. The pushgateway keeps what was pushed in memory, so a redeploy starts it empty
    and the window then counts from the NOC's start: a job that never ran since pages one window later.
  compensating_control: tests/test_jobs.py::test_every_job_reports_success_as_its_last_step
  compensates: each job's success line is the last line of its make target, so a failed step sends nothing
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-45
  kind: accepted-risk
  title: the central log store's folder on the lab host is writable by every user
  detectors: [store-world-writable]
  likelihood: 1
  impact: 2
  reasoning: >-
    Loki runs as its image's user (uid 10001), not as whoever renders the lab, so render makes
    build/noc/loki mode 0777 for Loki to write there (decision 0025). Any user with a shell on the lab
    host can then add to, change or delete the store's files, and with them the logs and flight-recorder
    dumps a later investigation would rely on. The lab host is a single-user machine or a CI runner, and
    the store holds no secret (tests/live/observe/test_central_store.py::test_no_secret_in_the_central_store).
    The fix on a shared host is a folder owned by uid 10001, made once by an administrator, or a Docker
    volume.
  compensating_control: tests/test_monitoring.py::test_the_central_store_keeps_its_data_on_the_lab_host
  compensates: nothing about who writes there; it shows the folder is the store's and that render never empties it
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-46
  kind: accepted-risk
  title: lines the central store takes in during the minute after it restarts are lost if it crashes again in that minute
  detectors: [store-checkpoint-window]
  likelihood: 1
  impact: 2
  reasoning: >-
    Loki 3.1.1 starts each stream's count of lines again after it replays its write-ahead log, and the next
    replay drops what was counted since as duplicates until a new checkpoint is written (V-027). Loki
    checkpoints every 30 s here, so its first checkpoint after a start is done about a minute later (57 s
    in one run here). A second power cut inside that minute can lose lines the store took in since the
    first, the flight-recorder dumps included: up to all of them on a stream with history, fewer on a young
    one (4 of r2's last 111 lines in one drill run without the wait); the nodes' own copies went with the same cuts. Two cuts a
    minute apart are a failing supply or a breaker being tried, the case where the evidence matters most.
    The fix is a Loki release that keeps the counts across a replay, or a store that writes each line
    through before it answers.
  compensating_control: tests/live/test_power_event.py::test_evidence_outlives_a_power_cut
  compensates: it shows lines survive a cut once the first checkpoint after a restart is written, not inside the minute before it
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-55
  kind: accepted-risk
  title: h2's forwarder cuts every GET / from the NOC's address answered 200, not only the NOC's own check, and a check that fails on content too
  detectors: [log-cut-at-source]
  likelihood: 2
  impact: 2
  reasoning: >-
    The cut (decision 0026) matches a line by its client address (the collector's, 10.30.30.10), its
    request line (GET / HTTP/1.1) and a 200 status, because that is all an access line says. So an
    operator on noc loading h2's page, or anything else on noc making that same request, is cut with the
    check and reaches the store only as a count. A check that fails on content (WebContentWrong) still
    answers 200, so its lines are cut too: the page fires, but the store shows those checks only as
    counts. A request from any other address, any other page and any other status are forwarded as
    written. Anyone able to run commands on noc already holds the NOC's store and rules. The check could
    be told apart with no change to the app: http.server answers GET /?netlab-check with the same page
    and logs the query string, so a marked check URL would let the cut take only the check. That is not
    done, because the check would then no longer ask for exactly what a user asks for, and a real app
    can answer a marked URL differently (a cache, a router, a redirect).
  compensating_control: tests/live/observe/test_volume.py::test_noisy_kind_cut_at_the_source_while_wanted_lines_arrive
  compensates: only that one kind is cut, every cut line is counted in the store, a failed request (404) from the NOC arrives as written, and a check that fails on content still pages
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-56
  kind: accepted-risk
  title: the ingest budget counts the bytes the collector hands the store, and only pages
  likelihood: 2
  impact: 2
  reasoning: >-
    log_bytes_total adds up the length of each line's message at the collector. Loki's own disk use adds
    an index and labels and takes compression off, so a source at its budget can use more or less disk
    than its budget says; store_mb is checked against the budgets, not against Loki's disk. Nothing stops
    a source over its budget: LogIngestOverBudget pages once its last 24 h passes it, and every line is
    still stored, so a flood can fill noc's disk in less than a day. Lines from an address the collector
    can't map are labelled node=unknown, with no budget. A real NOC would also set Loki's per-stream rate
    limits, which drop lines.
  compensating_control: tests/test_volume.py::test_budget_rule_pages_once_a_source_passes_its_day
  compensates: a source over its day's budget pages, named by node and source, with the day's total in the page
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-57
  kind: accepted-risk
  title: a source over its day's budget pages once and stays firing for the rest of that day
  likelihood: 2
  impact: 1
  reasoning: >-
    LogIngestOverBudget reads the last 24 h, as a licence or a store counts it. Once a burst puts a source
    over, the alert stays firing until the burst is more than a day old (tests/test_volume.py proves it
    clears then), so a second flood from the same source that day is no new page. A pace alert would
    catch it, and would also page on the operator's normal bursts (make drift and make apply every five
    minutes), which is why the budget is a day's total (decision 0026).
  compensating_control: none (`make ingest` shows each source's current pace against its budget on demand)
  compensates: while it fires, the page names the source and its day's total, and `make ingest` shows whether it is still sending
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-58
  kind: accepted-risk
  title: each detection's false-positive figure comes from 30 minutes of a stated workload in the lab
  likelihood: 3
  impact: 2
  reasoning: >-
    `make fp-review` (decision 0027) counts every page over 30 minutes of a stated benign workload: a
    user's page loads and pings, and the operator's drift, apply, verify, testevent and locate every five
    minutes, on a lab with nothing broken. A real campus has other normal work (maintenance windows,
    a carrier that flaps, many users at once, a reboot window that runs out), and slower patterns than
    30 minutes. So a figure of 0 is 0 pages over that workload, not a rate for a real network. Two
    detections look back further than the review, PendingRebootOverdue (a reboot pending over 1 h) and
    LogIngestOverBudget (a day's bytes), so their 0 measures nothing; their cells say so, and
    LogIngestOverBudget's figure is the review's per-day ingest table. The review can't tell a real fault
    in its window from a false page, so a figure can overstate, and a page the workload caused that
    arrives more than its 120 s wait after the workload ends would be missed.
  compensating_control: tests/test_detections.py::test_table_has_a_full_row_for_every_deployed_rule_and_a_current_review
  compensates: the workload is stated in docs/detections.md, every figure is from the current 92-day cycle and from the rules that run now
  owner: DoctorMen
  review_by: 2027-01-15
  presented_to: pending
  presented_on: null
  presented_evidence: null

- id: RISK-60
  kind: accepted-risk
  title: root on a router changes FRR with no record, and can stop the accounting
  detectors: [root-skips-accounting]
  likelihood: 2
  impact: 4
  reasoning: >-
    The accounting proxy (decision 0029) sees only what reaches FRR through it. Root keeps FRR's own
    sockets (root and frrvty), so vtysh as root goes straight to the daemons, and root can also stop the
    proxy or delete the box's copy of the records. The collector trusts a record, or a line of r2's
    translation log, by the port below 1024 it came from, which root may send from: root on the router,
    and root in any of its sidecars, which share its network namespace (frr_exporter and the translation
    log run as root), can send a line the collector takes for one. In this lab root is the `docker exec`
    console, which every live test and the carrier's isp use, and which anyone who can run docker on the
    host has. frr_exporter shares the same sockets (RISK-33). What already reached the NOC stays there,
    and a change with no record names no one in `make drift`, even after the CM tool put the intent back
    in between. The fix is no shared root: a login
    per person through sshd with short-lived certificates (OROS ACC-3, a later build), sudo rules that
    leave root to break-glass use, and an alert on any FRR change no record explains.
  compensating_control: tests/live/observe/test_accounting.py::test_record_leaves_the_box_and_outlives_root_deleting_its_copy
  compensates: a record is at the NOC within seconds, and root deleting the box's copy leaves the NOC's whole
  owner: DoctorMen
