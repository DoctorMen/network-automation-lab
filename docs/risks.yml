- id: RISK-41
  kind: accepted-risk
  title: a silence added by hand in Alertmanager skips the file's checks until make silence runs
  likelihood: 2
  impact: 2
  reasoning: >-
    Alertmanager takes any silence through its API, amtool or its web page, however wide and however
    long. monitoring/silences.yml and its checks (decision 0020) hold only the silences written there.
    Nothing stops a person on shift from silencing a whole router by hand; make silence then names it and
    fails, but only when someone runs it or make deploy runs it. Closing the API to everyone but make
    silence would need a proxy in front of Alertmanager.
  compensating_control: tests/test_silence.py::test_a_silence_added_by_hand_is_reported
  compensates: make silence lists every active silence the file doesn't hold, with who set it and when it ends, and fails
  owner: DoctorMen
