- id: V-013
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), frr-reload.py from the image
  symptom: a reload put the BGP password on a vtysh command line and in frr-reload.log, and a reload from intent with no password line dropped the session
  verdict: normal-behaviour
  evidence:
    - "2026-10-15, a lab with a hand change on r2 and frr-reload.py run without --bindir: tests/live/test_secrets.py found the password in clab-<lab>-r2:/var/log/frr/frr-reload.log and in /proc/<pid>/cmdline of a docker exec on the host. frr-reload.py runs vtysh -c with each line it changes and logs them at INFO"
