  symptom: r1 and r3 sent internet traffic out of eth0 (Docker) instead of to r2; the kernel default route beat the OSPF default
  verdict: lab-artifact
  evidence:
    - CI run 38159498719 (commit 6ed8aec) failed its live tests; commit ed58c1e explains the cause
