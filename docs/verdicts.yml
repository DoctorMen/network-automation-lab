- id: V-005
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git)
  symptom: frr.conf says "log stdout informational", but no daemon log line after startup reaches docker logs or anywhere else
  verdict: my-config
