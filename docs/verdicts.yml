- id: V-015
  opened: 2026-10-16
  version: prom/prometheus:v2.53.0, tynany/frr_exporter:v1.3.1, FRR 8.4.1_git
  symptom: BFDPeerDown reached the pager 28 s after r1's BFD session to r2 went down, past its 27 s bound, in one full live run of three
  verdict: my-config
  evidence:
    - "2026-10-16, lab na6, tests/live/observe/test_state.py::test_bfd_peer_down_while_ospf_and_ping_stay_up: 'paged 28.0 s after BFD went down'"
    - "Prometheus history for that run (query_range, 1 s step, times from BFD going down): frr_bfd_peer_state{node=\"r1\",peer=\"10.0.12.1\"} missing from about +3 s to +14 s, then 0; frr_ospf_neighbor_adjacencies{iface=\"eth1\"} 0 at +4 s, 1 at +14 s; ALERTS pending from +8 s to +17 s, then a second pending series from +18 s, firing at +28 s. FRR deletes the session when OSPF drops the adjacency and adds it back, still down, when OSPF re-forms"
    - "The rule was `frr_bfd_peer_state{...} != 1 or absent(...)`: the series half keeps the target's labels (job, instance, owner, role), absent() gives node and peer only, so the alert changed identity when the series came back and its 10 s `for` started again"
  fixed_in: "decision 0018 (wave 2's base build): every per-object rule is `max by (<the object's keys>) (... ) or absent(...)`, so both halves label the alert alike, and owner and role are rule labels; tests/test_monitoring.py::test_an_alert_keeps_its_identity_while_its_series_comes_and_goes"

- id: V-020
  opened: 2026-10-16
  version: prom/prometheus:v2.53.0, prom/alertmanager:v0.27.0, FRR 8.4.1_git
  symptom: With r3 cut off and frr_exporter killed beside r1, the pager got three pages instead of two, NodeDown for h2 (behind r3) as well, in one full live run of three; the same test alone had passed
  verdict: my-config
  evidence:
    - "2026-10-16, lab na10, full `pytest -v tests/live` at commit 500ab80, tests/live/observe/test_outage.py::test_a_parent_failure_pages_once_and_a_killed_service_pages_again: \"pages for this outage: [('NodeDown', 'h2', 'h2'), ('NodeDown', 'r3', 'r3'), ('TargetDown', 'r1', 'frr@r1')]\""
    - "Every cause's page, r3's and h2's alike, had `keep_firing_for: 75s`, and h2's page is held back only while a cause it lists fires. h2 answers its probe a scrape after r3 does, so its page went on firing a few seconds after r3's ended and was sent then. The Prometheus history of that run was not kept (the lab was rebuilt); the order is read from the rules"
    - "After the fix, the same outage (Prometheus query_range, 1 s step): NodeDown for r3 and for h2 both end at +313 s, while CauseSeen for r3 fires until +389 s, so h2's page ends 76 s inside r3's hold"
  fixed_in: "decision 0021 (commit 2221f20): the markers keep firing 75 s after recovery and no page does; tests/test_dependencies.py::test_a_cause_keeps_holding_back_through_the_slowest_recovery"

- id: V-021
  opened: 2026-10-16
  version: prom/prometheus:v2.53.0, prom/alertmanager:v0.27.0, prom/node-exporter:v1.8.2
  symptom: r1's link to fw1 down for 7 s paged nothing, though InterfaceFlapped fired once the carrier was back
  verdict: my-config
  evidence:
    - "2026-10-16, review of commit 4decaae on lab na10: with r1 eth3 down 7.1 s, Prometheus had InterfaceFlapped firing, LinkDown and NodeDown for fw1 pending, CauseSeen for the link and for fw1 firing, and the pager had received nothing. A 0.3 s flap timed onto a scrape of r1's node_exporter gave the same: the link's marker fired and nothing paged"
    - "Each InterfaceFlapped listed its own link in deps. The link's marker fires on the first scrape that sees it down and keeps firing 75 s, while LinkDown needs its condition for 10 s, so the flap was held back by a cause whose own page never came"
    - "2026-10-16, lab na10, with the old deps put back: tests/live/observe/test_outage.py::test_a_link_down_for_seconds_pages_once_as_a_flap failed with \"r1 eth3 down for 7 s did not page\"; with the fix it passed"
  fixed_in: "decision 0021 (commit 231e6d3): a flap lists its router and what is in front of it, never its own link, and stays quiet for 40 s after LinkDown for its link fired; tests/test_dependencies.py::test_a_flap_is_never_held_back_by_its_own_link"

- id: V-022
  opened: 2026-10-16
  version: prom/alertmanager:v0.27.0
  symptom: Watchdog, routed with repeat_interval 10s, was mailed every 15 s, not every 10 s
  verdict: normal-behaviour
  evidence:
    - "2026-10-16, review of commit 4decaae on lab na10: 168 of 184 gaps between Watchdog mails in Mailpit were 15 s"
    - "Alertmanager sends a group only when it flushes it, every group_interval (5 s here), and mails a firing group again on a flush only once more than repeat_interval has passed since the last mail: 10 s has not passed at the second flush, so the mail waits for the third"
    - "2026-10-16, lab na10, repeat_interval 6s: the gaps between the last eight Watchdog mails were all 10.0 s; with 10s put back, tests/live/observe/test_deadman.py::test_a_broken_mail_path_pages_on_the_second_channel failed with \"Watchdog mailed every [15.0, 15.0, 15.0, 15.0] s, not every 10 s\""
  fixed_in: "decision 0022 (commit 1152e67): repeat_interval is every less group_interval plus 1 s, and the inventory check requires every to be a whole number of group_interval"

- id: V-023
  opened: 2026-10-16
  version: prom/prometheus:v2.53.0, prom/alertmanager:v0.27.0
  symptom: every fresh deploy and every power cycle of the NOC paged AlertPathSilent for about 5 s, though the mail path worked
  verdict: normal-behaviour
  evidence:
    - "2026-10-16, review of commit 4decaae on lab na10, fresh deploy: AlertPathSilent fired 06:49:14 and resolved 06:49:19; Watchdog was active from 06:48:38 but its first mail arrived 06:49:44, and prometheus_notifications_dropped_total was 7. After the power drill's cycle the same, with 7 dropped. A restart of Prometheus alone paged nothing"
    - "Prometheus drops what it sends before Alertmanager answers, and sends a firing alert again only after its resend delay (--rules.alert.resend-delay, default 1m). AlertPathSilent counted 30 s from the NOC's start"
    - "2026-10-16, lab na10 at commit b0057ad, fresh labctl up at 09:36:45 UTC: the first Watchdog mail arrived 69.2 s after the pushgateway started, the gaps between the next mails were 10.0 s, and at 09:40:21 the pager had received nothing. After make power-drill's power cycle of the same lab (labctl.sh cycle, NOC back at 10:04:42), the first mail came 66.6 s after the start and the pager received nothing in the 131 s that followed"
  fixed_in: "decision 0022 (commit 1152e67): AlertPathSilent counts from a minute after the NOC's start; tests/test_jobs.py::test_the_alert_path_is_not_due_before_the_first_resend"
- id: V-025
  opened: 2026-10-16
  version: the lab host's kernel (Linux 6.18), prom/node-exporter:v1.8.2, frrouting/frr:v8.4.1 (iproute2 5.15)
  symptom: h2 eth1's transmit drop counter stayed at 0 while its HTB queue dropped most of a burst
  verdict: normal-behaviour
  evidence:
    - "2026-10-16, lab na11: 3000 datagrams of 200 bytes from h2 to r3 in 9 ms; r3 received 1098, `tc -s qdisc` on h2 counted 1902 dropped, node_network_transmit_drop_total{node=\"h2\",device=\"eth1\"} stayed 0"
    - "The interface's tx_dropped counts packets the driver could not send, after the queue; a packet the queue refuses never reaches the driver. tests/live/observe/test_loss.py::test_a_microburst_the_average_hides_is_traced_to_its_queue checks both on every observe run"
  workaround: the queue's own counter is collected (node_exporter's qdisc collector) and pages as QueueDrops (decision 0023)

- id: V-026
  opened: 2026-10-16
  version: the lab host's kernel (Linux 6.18), frrouting/frr:v8.4.1 (Python 3 on Alpine)
  symptom: send() succeeded for all 3000 datagrams of a burst from h2, and h2's Udp OutDatagrams rose by only the 1113 that arrived
  verdict: normal-behaviour
  evidence:
    - "2026-10-16, lab na11, /proc/net/snmp on h2 around one burst: OutDatagrams +1113, SndbufErrors +1887; `tc -s qdisc` on h2 counted 1887 dropped; r3 received 1113"
    - "A datagram the sender's own queue drops makes the kernel return ENOBUFS internally; without IP_RECVERR the socket hides it from send() and counts it under SndbufErrors instead of OutDatagrams (udp(7))"
  workaround: the test counts what was sent with its own sender and what arrived with a receiver, never the sender's OutDatagrams; monitoring/coverage.yml says what OutDatagrams counts

- id: V-027
  opened: 2026-10-16
  version: grafana/loki:3.1.1 (single binary, filesystem store, write-ahead log under /loki/wal)
  symptom: lines the central store had answered with before a crash were gone after the next one, when the store had restarted a few minutes before
  verdict: platform-bug
  evidence:
    - "2026-10-16, lab na11, Loki checkpointing every 5 minutes (its default): a line logged on r2 and found in the store at 03:16:05 was gone after Loki was killed and started; every line since Loki's previous start at 03:12 was gone with it, and loki_ingester_wal_duplicate_entries_total rose while loki_ingester_wal_recovered_entries_total stayed at 4354"
    - "2026-10-16, lab na11, checkpointing every 30 s: a line logged 2 s after Loki started was gone after the next kill; a line logged after its first checkpoint (about 57 s after the start) was still there after the next kill"
    - "Loki 3.1.1 source: after a successful replay, ingesterRecoverer.Close() calls resetCounter() on every stream (pkg/ingester/recovery.go), and stream.Push drops a replayed record whose counter is not above the stream's (pkg/ingester/stream.go). The next replay starts from the last checkpoint's counters, so the records written since the reset are dropped as duplicates until a new checkpoint replaces that one. The first checkpoint comes one checkpoint_duration after the start and is written over 90% of another (pkg/ingester/checkpoint.go)"
    - "Whether a later Loki release fixes it is not checked here"
  workaround: Loki checkpoints every 30 s (templates/monitoring/loki.yaml.j2), so the window is about a minute after each restart; the power drill restarts the store first and cuts only after its first checkpoint (tests/live/test_power_event.py::test_evidence_outlives_a_power_cut). What is left is RISK-46
