- id: V-006
  opened: 2026-10-15
  version: iptables 1.8.7 (legacy) in frrouting/frr:v8.4.1; sandbox kernel 6.18.44
  symptom: fw1's default-drop LOG rule counts packets, but no "fw-drop" line appears in any log
  verdict: lab-artifact
  evidence:
    - "lab fw1: LOG rule at 4 packets after h1 tried 10.20.20.10:443 and :8443; dmesg on the host and in fw1 has 0 fw-drop lines; no syslogd runs in fw1"
    - "host /proc/sys/net/netfilter/nf_log_all_netns is 0; kernel docs: by default only init_net can log with the LOG target, so containers can't flood the host log (https://docs.kernel.org/networking/netfilter-sysctl.html)"
  workaround: "not tested here: NFLOG with a reader in fw1's namespace, or nf_log_all_netns=1 on the host (host-wide, so not tried in this shared sandbox). Count drops with iptables counters meanwhile, as test_firewall_counts_the_drop does"

- id: V-007
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), /usr/lib/frr/frrcommon.sh
  symptom: "every router's start log has \"/usr/lib/frr/frrcommon.sh: line 211: kill: `': not a pid or valid job spec\" once per non-zebra daemon, then \"Cannot stop zebra: pid file not found\""
  verdict: platform-bug
  evidence:
    - docker logs of every lab router, at every start
    - "frrcommon.sh: watchfrr's startup 'restart all' runs all_stop --quiet before any daemon is up. daemon_stop with --quiet and no pid file skips its early return and runs kill -2 with an empty pid. zebra is stopped last without --quiet, hence 'Cannot stop zebra'"
  workaround: none needed; the daemons start normally (watchfrr logs "all daemons up")

- id: V-008
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git); sandbox kernel 6.18.44 only
  symptom: zebra logs "RTADV socket ... Address family not supported by protocol(97)" and "Disabling MPLS support (no kernel support)" at start
  verdict: lab-artifact
  evidence:
    - "docker logs clab-<lab>-r1 in this sandbox; sysctl net.ipv6.conf.all.forwarding is an unknown key here, so the kernel has no IPv6"
  workaround: none needed for this IPv4-only lab; GitHub runners have IPv6, which is why V-002 shows up there and not here

- id: V-009
  opened: 2026-10-15
  version: ansible-core 2.21.5, drift.yml at 1e810cf
  symptom: with IPv4 forwarding off on r1, make drift fails on "ip forwarding", although the drift.yml comment says forwarding lines are ignored
  verdict: my-config
  evidence:
    - "2026-10-15, lab r1 with net.ipv4.ip_forward=0: frr-reload --test lists 'ip forwarding' under Lines To Delete and make drift fails (restored to 1 afterwards)"
    - "the filter '^(no )?ipv6? forwarding$' reads as 'ipv' plus an optional '6', so it never matches 'ip forwarding'"
  workaround: none needed; a router with IPv4 forwarding off is broken, so failing is right
  fixed_in: PR #2 (the filter now reads ipv6 only, and its comment and docs/collection-methods.md say so)

- id: V-010
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), netlab/restore.py before its first commit
  symptom: the restore drill failed once on r2's untouched backup, listing every interface's "ip address" line as missing from the throwaway router
  verdict: my-config
  evidence:
    - "the boot check looked for 'zebra' anywhere in ps, and watchfrr's own arguments ('/usr/lib/frr/watchfrr zebra bgpd ospfd staticd bfdd') contain it"
    - "2026-10-15, 5 throwaway r2 boots polled with the old check: in one it reported booted while no /usr/lib/frr/zebra process existed yet"
    - "after matching the zebra binary's own command line: 60 boots (15 drills of 4 routers at once), and none reported booted before its zebra ran. Three of those boots were slow for another reason (a crash at start, V-011), which this check can't see"
  workaround: none needed
  fixed_in: the build that added the restore drill (Scratch.wait_booted matches lines starting /usr/lib/frr/zebra)

- id: V-011
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), throwaway restore-drill routers (--network none) in the sandbox, 4 CPUs shared with another lab
  symptom: in about 1 throwaway boot in 20, zebra or bgpd crashes as it starts and only comes back about 60 s later, so the restore drill's 60 s boot wait timed out once, and its zebra-only boot check let a drill run while bgpd was down
  evidence:
    - "2026-10-15, 15 rounds of 4 throwaway routers booted at once (r1, r2, r3, isp): in 3 rounds one router had no /usr/lib/frr/zebra process at 12 s; each round finished booting at 66.9 to 67.5 s, the rest at 1.1 to 1.5 s"
    - "the same day, docker logs of one such router (round 18 of a second sample): watchfrr reports ospfd, staticd and bfdd 'state -> up' but never zebra, after 'watchfrr.sh restart all' printed 'Cannot stop zebra: pid file not found'; /var/run/frr/zebra.pid and zserv.api exist, the process does not"
    - "watchfrr's minimum restart interval defaults to 60 s, which matches the delay"
    - "make restore-drill against a good backup: test_every_router_restores_cleanly failed once with 'drill-na3-r1-... did not finish booting in 60 s'"
    - "2026-10-15 (fix round), the same good backup: the drill failed 2 times in 7, each listing the throwaway isp's whole router bgp stanza as missing; caught once more on r2 with the throwaway's stderr 'bgpd crashed in startup, signal 11' and 'Failed to start bgpd!' while zebra ran, so the zebra-only boot check had passed"
    - "the same day, another throwaway's stderr: 'zebra crashed in startup, signal 11'"
    - "with bgpd killed in a booted throwaway, the old check returned in 0.45 s and frr-reload listed 17 missing lines; the new one waited 4.3 s for watchfrr to start bgpd again, then 0 problems"
    - "after the change: 15 drills (60 boots), two boots hit a zebra crash and booted at 62.0 and 66.4 s, 0 problems"
  workaround: Scratch.wait_booted waits until every daemon on watchfrr's command line runs and no start script is left, up to 120 s, which covers one watchfrr restart; the drill then passes, slower

- id: V-012
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git)
  symptom: FRR's support-bundle script wrote nothing and still exited 0; with upstream's command list it wrote the BGP password in clear
  verdict: platform-bug
  evidence:
    - "2026-10-15, lab r1: python3 /usr/lib/frr/generate_support_bundle.py -l /tmp -> CRITICAL:root:Cannot read config file: /etc/frr/support_bundle_commands.conf, rc=0, no file written. The image ships the script but not the list"
    - "2026-10-15, lab r2 with TCP MD5 on: the same script with FRR 8.4.1's tools/etc/frr/support_bundle_commands.conf wrote zebra_support_bundle.log, which runs show running-config and held the password in clear"
  workaround: netlab/bundle/support_bundle_commands.conf, vendored without show running-config and passed with -c; netlab finding --verify refuses an empty log or a password line (decision 0017)

- id: V-013
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), frr-reload.py from the image
  symptom: a reload put the BGP password on a vtysh command line and in frr-reload.log, and a reload from intent with no password line dropped the session
  verdict: normal-behaviour
  evidence:
    - "2026-10-15, lab na4: with a hand change on r2 and frr-reload.py run without --bindir, tests/live/test_secrets.py found the password in clab-na4-r2:/var/log/frr/frr-reload.log and in /proc/<pid>/cmdline of a docker exec on the host. frr-reload.py runs vtysh -c with each line it changes and logs them at INFO"
    - "2026-10-15, same lab with the password hidden as a tag but not dropped: connectionsDropped went from 6 to 7 during make apply, because frr-reload.py deleted a line the intended file doesn't hold"
  workaround: frr-reload.py runs with --bindir pointing at the redacting vtysh in drop mode, so it never sees a password line; deploy.yml sets the password itself through vtysh's stdin (decision 0016)

- id: V-014
  opened: 2026-10-15
  version: ansible-core from ansible>=10, community.docker connection
  symptom: with no_log on and the password only in the task's stdin, the password still appeared in a file on the routers and on the controller
  verdict: normal-behaviour
  evidence:
    - "2026-10-15, lab na4 with ansible_pipelining false: tests/live/test_secrets.py found it in AnsiballZ_command.py under /root/.ansible/tmp in clab-na4-r2 and clab-na4-isp, and under the controller's /root/.ansible/tmp/ansible-local-*. Without pipelining, Ansible writes each module with its arguments to a temp file on the target; no_log only hides output"
  workaround: ansible_pipelining true in ansible/group_vars/routers.yml, which pipes the module to the remote Python instead (decision 0016)
