# Odd behaviours seen in this lab, each with one verdict, the version it was seen on,
# and either the commit that fixed it or the workaround. netlab/records.py lints this file
# (tests/test_verdicts.py): an entry may go without a verdict for 5 working days at most.
#
# Every entry here was checked in the lab, in a throwaway container, or in git and CI history.
#
# verdict:
#   my-config         our config or tooling caused it
#   normal-behaviour  the platform does what it is documented (or coded) to do; we expected otherwise
#   platform-bug      a defect in FRR, Alpine, Docker or the kernel
#   lab-artifact      comes from running the network in containers; real gear would not do it

