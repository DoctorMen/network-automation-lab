# Odd behaviours seen in this lab, each with one verdict, the version it was seen on,
# and either the commit that fixed it or the workaround. netlab/records.py lints this file
# (tests/test_verdicts.py): an entry may go without a verdict for 5 working days at most.
#
# Every entry here was checked in the lab, in a throwaway container, or in git and CI history.
#
# verdict:
#   my-config         our config or tooling caused it
#   normal-behaviour  the platform does what it is documented (or coded) to do; we expected otherwise
#   platform-bug      a defect in FRR, Alpine, Docker or the kernel
#   lab-artifact      comes from running the network in containers; real gear would not do it

- id: V-001
  opened: 2026-10-11
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git) on containerlab 0.68.0, GitHub ubuntu-latest
  symptom: r1 and r3 sent internet traffic out of eth0 (Docker) instead of to r2; the kernel default route beat the OSPF default
  verdict: lab-artifact
  evidence:
    - CI run 38159498719 (commit 6ed8aec) failed its live tests; commit ed58c1e explains the cause
    - "2026-10-15, throwaway FRR container on Docker's bridge: show ip route 0.0.0.0/0 -> Known via \"kernel\", distance 0, metric 0, best"
  fixed_in: ed58c1e (network-mode none; decision 0007)

- id: V-002
  opened: 2026-10-11
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git) on containerlab 0.68.0, GitHub ubuntu-latest
  symptom: drift check failed on "ipv6 forwarding" although nobody changed anything
  verdict: normal-behaviour
  evidence:
    - CI run 38159909835 (commit ed58c1e) passed its live tests and failed the drift check; commit 844f27a says the runner enables IPv6 forwarding
    - "2026-10-15, lab r1 with net.ipv4.ip_forward=0: running-config shows 'no ip forwarding' (zebra mirrors the kernel sysctl). The IPv6 form can't be shown here: this sandbox kernel has no IPv6 (V-008)"
  workaround: drift.yml ignores the forwarding line, because the topology's sysctls own it (844f27a)

