- id: V-006
  opened: 2026-10-15
  version: iptables 1.8.7 (legacy) in frrouting/frr:v8.4.1; sandbox kernel 6.18.44
  symptom: fw1's default-drop LOG rule counts packets, but no "fw-drop" line appears in any log
  verdict: lab-artifact
  evidence:
    - "lab fw1: LOG rule at 4 packets after h1 tried 10.20.20.10:443 and :8443; dmesg on the host and in fw1 has 0 fw-drop lines; no syslogd runs in fw1"
    - "host /proc/sys/net/netfilter/nf_log_all_netns is 0; kernel docs: by default only init_net can log with the LOG target, so containers can't flood the host log (https://docs.kernel.org/networking/netfilter-sysctl.html)"
  workaround: "not tested here: NFLOG with a reader in fw1's namespace, or nf_log_all_netns=1 on the host (host-wide, so not tried in this shared sandbox). Count drops with iptables counters meanwhile, as test_firewall_counts_the_drop does"

- id: V-007
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), /usr/lib/frr/frrcommon.sh
  symptom: "every router's start log has \"/usr/lib/frr/frrcommon.sh: line 211: kill: `': not a pid or valid job spec\" once per non-zebra daemon, then \"Cannot stop zebra: pid file not found\""
  verdict: platform-bug
  evidence:
    - docker logs of every lab router, at every start
    - "frrcommon.sh: watchfrr's startup 'restart all' runs all_stop --quiet before any daemon is up. daemon_stop with --quiet and no pid file skips its early return and runs kill -2 with an empty pid. zebra is stopped last without --quiet, hence 'Cannot stop zebra'"
  workaround: none needed; the daemons start normally (watchfrr logs "all daemons up")

