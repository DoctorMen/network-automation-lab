- id: V-007
  opened: 2026-10-15
  version: frrouting/frr:v8.4.1 (FRR 8.4.1_git), /usr/lib/frr/frrcommon.sh
  symptom: "every router's start log has \"/usr/lib/frr/frrcommon.sh: line 211: kill: `': not a pid or valid job spec\" once per non-zebra daemon, then \"Cannot stop zebra: pid file not found\""
  verdict: platform-bug
  evidence:
    - docker logs of every lab router, at every start
    - "frrcommon.sh: watchfrr's startup 'restart all' runs all_stop --quiet before any daemon is up. daemon_stop with --quiet and no pid file skips its early return and runs kill -2 with an empty pid. zebra is stopped last without --quiet, hence 'Cannot stop zebra'"
  workaround: none needed; the daemons start normally (watchfrr logs "all daemons up")

