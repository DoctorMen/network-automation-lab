  verdict: lab-artifact
  evidence:
    - "docker logs clab-<lab>-r1 in this sandbox; sysctl net.ipv6.conf.all.forwarding is an unknown key here, so the kernel has no IPv6"
  workaround: none needed for this IPv4-only lab; GitHub runners have IPv6, which is why V-002 shows up there and not here

- id: V-009
  opened: 2026-10-15
  version: ansible-core 2.21.5, drift.yml at 1e810cf
  symptom: with IPv4 forwarding off on r1, make drift fails on "ip forwarding", although the drift.yml comment says forwarding lines are ignored
  verdict: my-config
  evidence:
    - "2026-10-15, lab r1 with net.ipv4.ip_forward=0: frr-reload --test lists 'ip forwarding' under Lines To Delete and make drift fails (restored to 1 afterwards)"
