# Single source of truth for the lab. Every config, the Containerlab topology
# and the expected state the tests check are generated from this file.
lab_name: netauto

# Who runs this lab. Tools log in only to devices this team owns; everything else is
# someone else's network, observed from outside and escalated to its owner.
operator: campus NOC

# What every node actually runs: all seven use this one image. Read from the lab
# (`show version`, `apk info -v`, /etc/os-release), and checked against it on every
# CI run by tests/live/test_platform.py, so a silent upgrade fails the build.
platform:
  image: frrouting/frr:v8.4.1
  # The tag's index digest on Docker Hub (pushed 2022-12-01). A tag can be re-pushed; this can't.
  digest: sha256:0f8c174d95add7916101077d4716822552c758b8ff3d2dcb55104f6534202e3e
  frr: 8.4.1_git-r0      # apk package version; FRR itself reports 8.4.1_git
  alpine: 3.15.6
  busybox: 1.34.1-r7

asn:
  campus: 65001
  isp: 65100

routers:
  r1:
    owner: campus NOC
    role: core
    loopback: 10.255.0.1/32
    ospf: { area: 0 }
    static_routes:
      - { prefix: 10.10.10.0/24, next_hop: 10.0.100.2, redistribute: true }   # LAN-A sits behind the firewall
  r2:
    owner: campus NOC
    role: edge
    loopback: 10.255.0.2/32
    ospf: { area: 0, default_originate: true }
    bgp:
      local_as: campus
      neighbors:
        - { peer: isp, remote_as: isp, address: 198.51.100.1 }
      aggregate: 10.0.0.0/8
  r3:
    owner: campus NOC
    role: core
    loopback: 10.255.0.3/32
    ospf: { area: 0 }
  isp:
    owner: AS65100 carrier NOC
    role: isp
    loopback: 203.0.113.1/32
    bgp:
      local_as: isp
      neighbors:
        - { peer: r2, remote_as: campus, address: 198.51.100.0 }
      networks: [203.0.113.0/24]

firewalls:
  fw1:
    owner: campus NOC
    inside:  { interface: eth1, address: 10.10.10.1/24 }
    outside: { interface: eth2, address: 10.0.100.2/30, gateway: 10.0.100.1 }
    # Default policy for forwarded traffic is DROP. Order matters.
    # syn: true matches only a connection's opening packet (SYN set; ACK, RST, FIN clear). The rest of
    # the connection then passes as ESTABLISHED, so a forged mid-stream packet hits the default drop.
    rules:
      - { name: allow-established, state: [ESTABLISHED, RELATED], action: accept }
      - { name: allow-icmp,        proto: icmp,                      action: accept }
      - { name: allow-web,         proto: tcp, syn: true, dst: 10.20.20.0/24, dport: 80, action: accept }
      - { name: deny-ssh-to-servers, proto: tcp, dst: 10.20.20.0/24, dport: 22, action: drop }
      - { name: allow-internet,    src: 10.10.10.0/24, dst: 203.0.113.0/24,    action: accept }

hosts:
  h1: { owner: campus NOC, interface: eth1, address: 10.10.10.10/24, gateway: 10.10.10.1, segment: LAN-A }
  h2: { owner: campus NOC, interface: eth1, address: 10.20.20.10/24, gateway: 10.20.20.1, segment: LAN-B, services: [80, 22] }

# Point-to-point and LAN links. Each endpoint is device:interface@address.
links:
  - [r1:eth1@10.0.12.0/31, r2:eth1@10.0.12.1/31]
  - [r2:eth2@10.0.23.0/31, r3:eth1@10.0.23.1/31]
  - [r1:eth2@10.0.13.0/31, r3:eth2@10.0.13.1/31]
  - [r2:eth3@198.51.100.0/31, isp:eth1@198.51.100.1/31]
  - [fw1:eth2@10.0.100.2/30, r1:eth3@10.0.100.1/30]
  - [h1:eth1@10.10.10.10/24, fw1:eth1@10.10.10.1/24]
  - [h2:eth1@10.20.20.10/24, r3:eth3@10.20.20.1/24]
