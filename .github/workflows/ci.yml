name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so every control in docs/controls.yml has a dated result well inside its 31-day period.
  # GitHub runs schedules on the default branch only, and in a public repo disables them after
  # 60 days with no repository activity.
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  offline:
    name: Validate inventory and unit tests
    # Pinned, so the nightly run doesn't move to a new kernel or Docker without a commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make validate render
      - run: make test

  lab:
    name: Deploy the lab and test it live
    needs: offline
    # Pinned, so the nightly run doesn't move to a new kernel or Docker without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLAB_VERSION: "0.68.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ansible.txt
      - name: Install Containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v "$CLAB_VERSION"
      - name: Pull router image
        run: docker pull frrouting/frr:v8.4.1
      - name: Deploy
        id: deploy
        run: make deploy
      - name: Live tests (routing, reachability, firewall, failover, collection, locate, platform)
        run: make live  # also writes results/live.xml (JUnit, timestamped)
      - name: Config drift check (Ansible)
        # Runs even when a live test failed, so every run still backs up the configs.
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: make drift
      - name: Measure RAM (raw data for docs/sizing)
        continue-on-error: true  # a sizing reading is evidence, not a network test
        run: |
          # Drop the committed runner file first, so the artifact and the log only ever hold this run's reading.
          rm -f docs/sizing/data/*-github-runner.json
          make measure LAB_ENV=github-runner NOTE="GitHub ubuntu-24.04, containerlab $CLAB_VERSION, idle right after make live and make drift"
          cat docs/sizing/data/*-github-runner.json
      - name: Show routing tables on failure
        if: failure()
        run: |
          for r in r1 r2 r3 isp; do
            echo "=== $r"; docker exec clab-netauto-$r vtysh -c "show ip route" -c "show ip ospf neighbor" -c "show bfd peers brief" -c "show bgp summary" || true
          done
          docker exec clab-netauto-fw1 iptables -vnL FORWARD || true
          docker exec clab-netauto-r2 sh -c 'iptables -vnL; iptables -t raw -vnL' || true
      - name: Upload test results and config backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-and-backups
          path: |
            results/
            backups/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload sizing data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sizing-data
          path: docs/sizing/data/*-github-runner.json
          if-no-files-found: ignore
      - name: Destroy
        if: always()
        run: make destroy || true
