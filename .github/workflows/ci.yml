name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so every control in docs/controls.yml has a dated result well inside its 31-day period.
  # GitHub runs schedules on the default branch only, and in a public repo disables them after
  # 60 days with no repository activity.
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  offline:
    name: Validate inventory and unit tests
    # Pinned, so the nightly run doesn't move to a new kernel or Docker without a commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make validate render
      - run: make test  # also writes results/offline.xml (JUnit, timestamped)
      - name: Upload offline test results (dated evidence for the control-status check)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-results
          path: results/offline.xml
          if-no-files-found: error
          retention-days: 90
      - name: The runner's own kernel, by netlab.verify's rule (lab nodes install no kernel to check)
        continue-on-error: true  # a reboot the runner is waiting for is GitHub's to do, so this reports, not gates
        run: |
          python3 - <<'EOF'
          import os, platform
          from netlab.verify import kernel_status
          verdict = kernel_status(platform.release(), os.listdir("/lib/modules"))
          print("runner kernel:", verdict)
          raise SystemExit("not in effect" in verdict)
          EOF

  lab:
    name: Deploy the lab and test it live
    needs: offline
    # Pinned, so the nightly run doesn't move to a new kernel or Docker without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLAB_VERSION: "0.68.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ansible.txt
      - name: Install Containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v "$CLAB_VERSION"
      - name: Pull router image
        run: docker pull frrouting/frr:v8.4.1
      - name: Create this run's BGP password
        # No GitHub secret exists, so every run gets a new random one, 0600 in a 0700 folder outside
        # the checkout. `make deploy` sets it on r2 and isp through vtysh's stdin (decision 0016).
        run: |
          echo "NETLAB_SECRETS=$RUNNER_TEMP/netlab-secrets" >> "$GITHUB_ENV"
          NETLAB_SECRETS="$RUNNER_TEMP/netlab-secrets" make secrets
          # Masked: if a value ever reached this log, GitHub would print *** instead. echo is a shell
          # builtin, so the value is on no command line.
          for f in "$RUNNER_TEMP"/netlab-secrets/*; do echo "::add-mask::$(cat "$f")"; done
      - name: Deploy the network (no NOC sidecars; the observe job runs those)
        id: deploy
        # The inventory's own nodes only (--node-filter from `netlab nodes`), so this job pulls one image
        # and starts what it always started, plus the NOC's host. Decision 0018.
        run: make deploy-network
      - name: Live tests (routing, reachability, firewall, failover, collection, locate, platform)
        run: make live  # tests/live without tests/live/observe; also writes results/live.xml (JUnit, timestamped)
      - name: Config drift check (Ansible)
        # Runs even when a live test failed, so every run still backs up the configs.
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: make drift
      - name: Secret scan of this run's backups, results and build/
        id: secret-scan
        # Runs after drift, so it sees every file this run wrote. gitleaks knows the patterns; the
        # grep knows this run's actual password, read from its file (-f), never from a command line.
        # The backup runs only when this passed, so a password that reached backups/ never reaches restic.
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          make gitleaks
          for f in "$NETLAB_SECRETS"/*; do
            if grep -rlF -f "$f" backups results build; then echo "::error::this run's BGP password is in the files above"; exit 1; fi
          done
      # The backup destination is a restic repository kept between runs in the Actions cache. It is
      # created once by hand (drills.yml, input init_backup_repo) and never here: a job that creates
      # its target when none is found can't tell a lost target from a first run. A cache miss fails
      # the step. Pull requests skip it: a PR's cache is scoped to the PR, so main could never use it.
      - name: Restore the backup repository (fails if it is missing)
        id: backup-repo
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/backup
          key: restic-${{ github.run_id }}
          restore-keys: restic-
          fail-on-cache-miss: true
      - name: Back up configs to restic and verify them at the destination
        id: backup
        # make backup also searches the capture, and the snapshot it reads back, for this run's password
        # (from NETLAB_SECRETS), and sends nothing if the capture holds it.
        if: ${{ !cancelled() && steps.backup-repo.outcome == 'success' }}
        run: make backup BACKUP_REPO="$RUNNER_TEMP/backup/repo" BACKUP_PASSWORD="$RUNNER_TEMP/backup/password"
      - name: Keep the repository for the next run
        if: ${{ !cancelled() && steps.backup.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/backup
          key: restic-${{ github.run_id }}
      - name: Show routing tables on failure
        if: failure()
        run: |
          for r in r1 r2 r3 isp; do
            echo "=== $r"; docker exec clab-netauto-$r vtysh -c "show ip route" -c "show ip ospf neighbor" -c "show bfd peers brief" -c "show bgp summary" || true
            # FRR logs to stdout (`log stdout` in frr.conf), so a daemon that crashed or never started says why here.
            echo "--- $r processes and FRR log"; docker exec clab-netauto-$r ps -o pid,args || true
            docker logs --tail 60 clab-netauto-$r 2>&1 || true
          done
          docker exec clab-netauto-fw1 iptables -vnL FORWARD || true
          docker exec clab-netauto-r2 sh -c 'iptables -vnL; iptables -t raw -vnL' || true
      - name: Upload test results and config backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-and-backups
          path: |
            results/
            backups/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload the finding bundle (re-run by the reproduce job)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finding-bundle
          path: results/finding/
          if-no-files-found: ignore
          retention-days: 90
      - name: Destroy
        if: always()
        run: make destroy || true

  observe:
    name: Deploy the full lab and test the NOC (alerts, log arrival, central store)
    # In parallel with the lab job, on its own runner: the same network plus the NOC's sidecars
    # (decisions 0018 and 0019), and only the tests in tests/live/observe, which take links, sessions and
    # log sources down on purpose. The RAM measurement moved here: it reads the full lab.
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLAB_VERSION: "0.68.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ansible.txt
      - name: Install Containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v "$CLAB_VERSION"
      - name: Pull every image the full lab runs (the inventory's pinned tags)
        run: python3 -m netlab images | xargs -n1 docker pull
      - name: Create this run's BGP password
        # As in the lab job: a new random one per run, masked, outside the checkout (decision 0016).
        run: |
          echo "NETLAB_SECRETS=$RUNNER_TEMP/netlab-secrets" >> "$GITHUB_ENV"
          NETLAB_SECRETS="$RUNNER_TEMP/netlab-secrets" make secrets
          for f in "$RUNNER_TEMP"/netlab-secrets/*; do echo "::add-mask::$(cat "$f")"; done
      - name: Deploy (network and NOC)
        id: deploy
        run: make deploy
      - name: NOC tests (NOT-1 state alerts, NOT-2 coverage, NOT-3 arrival, NOT-5 volume, NOT-6 detections, NOT-7 central store)
        run: make observe  # also writes results/observe.xml (JUnit, timestamped)
      - name: Synthetic event from every log source (make testevent)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: make testevent
      - name: Each log source's last 24 h against its daily budget (make ingest, OROS NOT-5)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: make ingest
      - name: Config drift check (Ansible)
        # The observe tests put back everything they break; drift proves it.
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: make drift
      - name: Secret scan of this run's results and build/
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          make gitleaks
          for f in "$NETLAB_SECRETS"/*; do
            if grep -rlF -f "$f" backups results build; then echo "::error::this run's BGP password is in the files above"; exit 1; fi
          done
      - name: Measure RAM (raw data for docs/sizing)
        continue-on-error: true  # a sizing reading is evidence, not a network test
        run: |
          # Drop the committed runner file first, so the artifact and the log only ever hold this run's reading.
          rm -f docs/sizing/data/*-github-runner.json
          make measure LAB_ENV=github-runner NOTE="GitHub ubuntu-24.04, containerlab $CLAB_VERSION, full lab with the NOC, idle right after make observe and make drift"
          cat docs/sizing/data/*-github-runner.json
      - name: What the NOC fired and paged, on failure
        if: failure()
        run: make alerts || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observe-results
          path: |
            results/
            backups/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload sizing data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sizing-data
          path: docs/sizing/data/*-github-runner.json
          if-no-files-found: ignore
      - name: Destroy
        if: always()
        run: make destroy || true

  reproduce:
    name: Re-run the finding from its bundle alone (clean runner)
    # A runner that never saw the repo stands in for someone outside the team (OROS PRV-3): it gets
    # the bundle the lab job uploaded, stands up the lab from the bundle's copy, and re-runs it.
    needs: lab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLAB_VERSION: "0.68.0"
    steps:
      # No actions/checkout: nothing from the repo, only the bundle.
      - uses: actions/download-artifact@v4
        with:
          name: finding-bundle
          path: finding
      - name: Install Containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v "$CLAB_VERSION"
      - name: Stand up the lab from the bundle (Containerlab pulls the image the topology names)
        run: sudo containerlab deploy -t finding/lab/topology.clab.yml
      - name: On a healthy lab the bundle must say it did not reproduce
        # Exit 1 is "Did not reproduce". 0 would mean the check can't fail; 2 means it couldn't tell.
        run: |
          rc=0; sh finding/reproduce.sh || rc=$?
          if [ "$rc" != 1 ]; then echo "::error::expected Did not reproduce (exit 1), got exit $rc"; exit 1; fi
      - name: Recreate the fault (lab only) and re-run the finding
        run: |
          sh finding/lab/condition.sh
          sh finding/reproduce.sh
      - name: Upload the re-run's raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finding-rerun
          path: finding/rerun-*/
          if-no-files-found: ignore

  control-status:
    name: Every control's latest test is green and inside its period
    needs: [offline, lab]
    # Main's claims, proven by main's runs. A pull request's run tests other code, so it is skipped.
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # list earlier runs on main and download their JUnit artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: This run's results
        uses: actions/download-artifact@v4
        with:
          pattern: "*results*"
          path: build/evidence/${{ github.run_id }}
      - name: Check every control in docs/controls.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: make control-status
