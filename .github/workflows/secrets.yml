name: Secrets

# Its own workflow, so it runs on a push to any branch: a branch pushed to this public repo is
# public at once, pull request or not. ci.yml runs on main and pull requests only.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan of every commit (gitleaks)
    # Pinned, so the nightly run doesn't move to a new kernel or Docker without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history: a secret committed with --no-verify and deleted later is still found
      - run: make gitleaks  # .gitleaks.toml: the default rules plus the FRR password and confidential-marker rules
